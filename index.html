const NUM={blocos:{},busy:{},TAM:5,
 ativo(){return !!(window.SB&&window.SB.reservar&&window.SB.empresa)},
 chave(n){return 'durant.num.'+window.SB.empresa+'.'+(window.SB.uid||'')+'.'+n},
 ler(n){
  if(this.blocos[n])return this.blocos[n];
  let b=[];try{b=JSON.parse(localStorage.getItem(this.chave(n))||'[]')}catch(e){}
  return this.blocos[n]=(Array.isArray(b)?b:[]).filter(x=>x&&x.a<=x.f)
 },

 sobra(n){return this.ler(n).reduce((t,x)=>t+x.f-x.a+1,0)},
 async encher(n){
  if(this.busy[n])return;this.busy[n]=true;
  try{const a=await window.SB.reservar(n,this.TAM);this.ler(n).push({a,f:a+this.TAM-1});this.gravar(n)}
  finally{this.busy[n]=false}
 },
 async preparar(){for(const n of ['pedido','cliente']){if(this.sobra(n)<=2){try{await this.encher(n)}catch(e){}}}},
 tomar(n){
  const bl=this.ler(n);
  if(!bl.length){
   this.encher(n).catch(()=>{});

 }};

/* Campo de busca/filtro "ao vivo": atualiza o estado a cada tecla, mas só reconstrói a tela (render) quando a digitação não está em composição (dead-key/acento, ex.: til+a = ã). Reconstruir no meio da composição destrói o campo e quebra a formação do acento. */
function liveQ(id,set){
 const el=document.getElementById(id);if(!el)return;
 let composing=false;
 const go=()=>{set(el.value);const pos=el.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}};
 el.addEventListener('compositionstart',()=>composing=true);
 el.addEventListener('compositionend',()=>{composing=false;go()});
 el.oninput=e=>{if(composing||e.isComposing){set(el.value);return}go()};
}
/* Campo de data nativo dispara 'change' a cada dígito que já forma uma data válida (não só ao confirmar) — então qualquer efeito colateral que reescreva o valor ou re-renderize a tela no meio da digitação do ano acaba corrompendo o próprio campo (foco/estado interno do date-picker) e trava a digitação. onBlurOnce adia esse efeito para quando o campo realmente perde o foco (digitação concluída), evitando esse problema em qualquer listener de data. */
function onBlurOnce(el,fn){
 if(el._blurFn)el.removeEventListener('blur',el._blurFn);
 el._blurFn=fn;
 el.addEventListener('blur',fn,{once:true});
}
/* Para handlers de campo de data que precisam re-renderizar a tela (ex.: propagar prazo para outras peças do conjunto): nunca renderizar enquanto o campo ainda está focado (o Chromium quebra o próprio campo de data se o nó for substituído no meio da edição). Adia para o blur e, aí sim, para o próximo "tick" (setTimeout 0) — assim a renderização não concorre com o clique que está causando esse blur (ex.: clicar em "Salvar" logo depois de editar a data). */
function deferRender(el,fn){
 if(document.activeElement===el)onBlurOnce(el,()=>setTimeout(fn,0));
 else fn();
}
/* Atalho de ano em qualquer campo de data: digitar só 2 dígitos no ano (25/26/27…) assume 2025/2026/2027. Roda na fase de captura, antes de qualquer outro listener de 'change' ler o valor. Só corrige quando o campo perde o foco, para não interferir enquanto o ano ainda está sendo digitado. */
document.addEventListener('change',e=>{
 const el=e.target;
 if(!el||el.tagName!=='INPUT'||el.type!=='date'||!el.value)return;
 const fix=()=>{
  const m=el.value.match(/^(\d+)-(\d{2})-(\d{2})$/);
  if(!m)return;
  const y=+m[1];
  if(y<100){el.value=`${2000+y}-${m[2]}-${m[3]}`;el.dispatchEvent(new Event('change',{bubbles:true}))}
 };
 /* Usa uma propriedade própria (_yearFixFn), em vez de onBlurOnce/_blurFn, porque alguns campos de data (ex.: prazo único) também registram seu próprio handler de blur via deferRender para re-renderizar a tela — se os dois disputassem o mesmo slot de onBlurOnce, o último a se registrar venceria e apagaria o outro, deixando o ano errado ou a tela sem atualizar. Com propriedades separadas, os dois listeners de blur coexistem. */
 if(document.activeElement===el){
  if(el._yearFixFn)el.removeEventListener('blur',el._yearFixFn);
  el._yearFixFn=fix;
  el.addEventListener('blur',fix,{once:true});
 }else fix();
},true);

function fluxoCalc(){
 const r=[];for(let i=5;i>=0;i--){const x=new Date(TODAY().getFullYear(),TODAY().getMonth()-i,1),k=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;
  r.push({m:MESES_C[x.getMonth()],v:S.pedidos.filter(p=>(p.aprov||p.dped||'').slice(0,7)===k).reduce((a,p)=>a+(p.valor||0),0)})}
 return r;
}
/* Saldo de conta corrente (Fatia 1 do módulo financeiro, v176): saldo inicial informado no cadastro da
   conta (ver CRUD.contas) + lançamentos já PAGOS (recebidos/pagos) vinculados a ela por `r.conta`
   (nome/apelido da conta — mesma convenção de `forma`/`banco`, por nome em vez de id). Só entra o que já
   foi efetivamente liquidado (st==='pago') — lançamento em aberto é "previsto", não compõe o saldo em
   conta ainda. Lançamento sem `conta` vinculada (campo ainda opcional, ver 5.10) não entra no cálculo de
   nenhuma conta específica. */
const saldoConta=c=>{
 const ini=numBR(c.saldoIni||0);
 const rec=S.receber.filter(r=>r.conta===c.apelido&&r.st==='pago').reduce((a,r)=>a+(r.valor||0),0);
 const pag=S.pagar.filter(r=>r.conta===c.apelido&&r.st==='pago').reduce((a,r)=>a+(r.valor||0),0);
 return ini+rec-pag;
};
/* Despesas fixas recorrentes (Fatia 1 do financeiro, v176): gera a conta a pagar do mês corrente para
   cada despesa recorrente ativa, uma vez por mês — marca o lançamento com `recId`+`mesRef` pra nunca
   duplicar, mesmo chamando de novo (idempotente). Roda sempre que a tela Financeiro é aberta; o protótipo
   não tem agendador de verdade, então é assim que o mês corrente sempre acaba tendo a conta lançada, sem
   reentrada manual. Dia do vencimento maior que o nº de dias do mês (ex.: dia 31 em fevereiro) cai no
   último dia do mês. */
function gerarRecorrentesMes(){
 const hj=TODAY(),ano=hj.getFullYear(),mes=hj.getMonth(),mesRef=`${ano}-${String(mes+1).padStart(2,'0')}`;
 const ultimoDia=new Date(ano,mes+1,0).getDate();
 (S.cfg.recorrentes||[]).filter(x=>x.ativo).forEach(x=>{
  if(S.pagar.some(p=>p.recId===x.id&&p.mesRef===mesRef))return;
  const dia=Math.min(Math.max(1,+x.dia||1),ultimoDia);
  const venc=`${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
  S.pagar.unshift({id:'REC'+Date.now()+Math.floor(Math.random()*999),forn:x.nome,desc:`${x.nome} (despesa fixa de ${MESES_L[mes]})`,venc,valor:numBR(x.valor),forma:'',st:'aberto',categoria:x.categoria,conta:x.conta||null,recId:x.id,mesRef});
 });
}

function histHTML(c){

 const tot=fech.reduce((a,x)=>a+x.valor,0),ult=fech[0];

 const meses=first?Math.max(1,Math.round((TODAY()-d(first))/(864e5*30))):0;

 return `<div class="grid g-kpi">

  <div class="card kpi"><span class="l">Frequência</span><span class="v" style="font-size:22px">${fech.length>1?(()=>{const m=Math.max(1,Math.round(meses/(fech.length-1)));return 'a cada '+m+(m>1?' meses':' mês')})():'—'}</span><span class="s">${first?'cliente desde '+fdFull(first):''}</span></div>
 </div>
 ${Object.keys(tipos).length||tecs.length?`<div class="card"><div class="card-h"><h2>O que já pediu</h2></div>${Object.keys(tipos).length?`<div class="rede" style="margin:0 0 10px">${Object.entries(tipos).map(([k,v])=>`<span class="pill plain">${v} ${v>1?PLUR[k]:TIPOS_P[k].toLowerCase()}</span>`).join('')}</div>`:''}${tecs.length?`<div class="d" style="font-size:13.5px;color:var(--ink-2)">Tecidos: ${tecs.map(esc).join(' · ')}</div>`:''}</div>`:''}
 ${Object.keys(anos).sort().reverse().map(a=>`<div class="card"><div class="card-h"><h2>${a}</h2><span class="pill plain">${anos[a].length} ${anos[a].length>1?'pedidos':'pedido'}</span></div><div class="list">${anos[a].map(x=>`<button class="row" data-hped="${x.id}" style="width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;${x.pecas?'':'cursor:default'}"><div class="date"><b class="num">${d(x._d).getDate()}</b><span>${d(x._d).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div class="grow"><div class="t">${esc(x.item)} <span class="mono" style="color:var(--ink-3)">${x.id}</span></div><div class="d">${PARCEIROS[x.parc]||''}</div></div><b class="num">${brl(x.valor)}</b>${st(x)}</button>`).join('')}</div></div>`).join('')}`+histImpHTML(c);
}

const pecaFalta=p=>{let n=0;(CARAC[p.tipo]||[]).forEach(g=>{const [a,b]=grpCnt(g,p);n+=b-a});return n};
const pecaNome=p=>TIPOS_P[p.tipo]+(p.grupo?` · ${p.grupo}`:'');
function prazoGrupos(p){
 if(!p.pecas)return [];
 const seen=new Set(),out=[];
 p.pecas.forEach(pc=>{const g=pc.gid||pc.uid;if(seen.has(g))return;seen.add(g);out.push({nome:pc.grupo||pecaNome(pc),prazo:pc.prazo||null})});

/* ===== Grupos (terno/costume): peças do mesmo gid sempre no mesmo tecido/forro/produção/etapa ===== */
const GRUPO_SHARED=['prest','forn','etiq','tec','forroForn','forroCod','tecOrig','pad'];
function grupoAnchor(grp){return grp.find(x=>x.uid===x.gid)||grp[0]}
function syncGrupoCampos(pecas){
 const byGid={};
 (pecas||[]).forEach(pc=>{if(pc.gid)(byGid[pc.gid]=byGid[pc.gid]||[]).push(pc)});
 Object.values(byGid).forEach(grp=>{
  if(grp.length<2)return;
  const anchor=grupoAnchor(grp);
  GRUPO_SHARED.forEach(k=>{grp.forEach(x=>{if(x!==anchor)x[k]=anchor[k]})});
 });
}
/* Só os itens do checklist que são sobre a MESMA compra combinada de tecido/forro do grupo (os campos
   forn/tec/forroForn/forroCod são compartilhados — ver GRUPO_SHARED acima) fazem sentido ficar sincronizados
   entre as peças de um terno/costume. O resto do progresso (ficha, tecido enviado/recebido pela produção,
   prova etc.) é sempre independente por peça, porque cada peça pode ir pra um prestador diferente dentro do
   mesmo conjunto e seguir seu próprio ritmo — isso não pode ser sobrescrito.
   Antes, isso sempre copiava do "âncora" do grupo (a primeira peça) pras demais, então marcar/desmarcar o
   checklist numa peça que não era a âncora era revertido na hora seguinte (o clique nunca "pegava"). Agora,
   a peça que acabou de ser alterada (pcOrigem) é que manda, não importa se é a âncora ou não. */
const GRUPO_SHARED_CHK=['tecido','chegou','forro','confped','penv'];
function syncGrupoChecklist(p,pcOrigem){
 const byGid={};
 (p.pecas||[]).forEach(pc=>{if(pc.gid)(byGid[pc.gid]=byGid[pc.gid]||[]).push(pc)});
 Object.values(byGid).forEach(grp=>{
  if(grp.length<2)return;
  const origem=(pcOrigem&&grp.includes(pcOrigem))?pcOrigem:grupoAnchor(grp);
  p.atv=p.atv||{};p.atv[origem.uid]=p.atv[origem.uid]||{};
  grp.forEach(x=>{
   if(x===origem)return;
   p.atv[x.uid]=p.atv[x.uid]||{};
   GRUPO_SHARED_CHK.forEach(k=>{const v=p.atv[origem.uid][k];if(v)p.atv[x.uid][k]=v;else delete p.atv[x.uid][k]});
  });
 });
}
function syncGrupo(p,pcOrigem){syncGrupoCampos(p.pecas);syncGrupoChecklist(p,pcOrigem)}
function itemNums(pecas){
 const m=new Map();let n=0;
 (pecas||[]).forEach(p=>{const key=p.gid||p.uid;if(!m.has(key)){n++;m.set(key,n)}});
 return pc=>m.get(pc.gid||pc.uid);
}

const txtHTML=(p,g,f)=>`<div class="cf"><span class="cl">${f.l}${f.ph?'':' *'}</span><input class="ctl" data-ini="${p.uid}|${g.id}|${f.k}" autocomplete="off" placeholder="${esc(f.ph||f.l.toUpperCase())}" value="${esc((p.car[g.id]||{})[f.k]||'')}" aria-label="${f.l}"></div>`;
/* Preenche com o padrão de fábrica (f.d) qualquer campo de característica ainda vazio — nunca sobrescreve uma escolha já feita. Cobre peças de pedidos antigos, criadas antes de o campo ter um padrão definido (newPeca só aplica o padrão na criação). */

 (CARAC[p.tipo]||[]).forEach(g=>{

/* ===== Item com vários tecidos (lote) =====
   Cada tecido extra é uma peça normal em dr.pecas (por isso prazos, faturamento, atividades, compras e ficha
   continuam por peça), ligada à peça principal por `lote` (uid da principal). Enquanto ligada, espelha a
   personalização da principal; só tecido, metragem, padronagem, forro, cor do monograma, prazos e valor
   (se editado) são próprios. "Individualizar" solta a peça e ela passa a ser um item comum. */
const LOTE_COR=['monograma','monoextra'];

 dr.pecas.forEach(m=>{

  const cor={};LOTE_COR.forEach(g=>{cor[g]=((m.car||{})[g]||{}).cor});

  m.tipo=l.tipo;m.prest=l.prest;m.prod=l.prod;m.etiq=l.etiq;m.mono=l.mono;m.mono2=l.mono2;m.info=l.info;m.modv=l.modv;m.modo=l.modo;

 });
}

S.orcamentos=[];
S.lembAv=[{t:'Perguntar ao Felipe (WGT) a fórmula de metragem para camisa de manga curta',prazo:'2026-11-04',done:false}];
ui.sec=ui.sec||{};
const FORMAS=['Pix à vista','Cartão de crédito','Pix parcelado'];
const PLUR={camisa:'camisas',paleto:'paletós',calca:'calças',colete:'coletes',shorts:'shorts'};
const nextId=()=>{if(NUM.ativo()){let n;do{n=NUM.tomar('pedido')}while(S.pedidos.some(p=>p.id==='P-'+n)||S.orcamentos.some(p=>p.id==='P-'+n));if(S.cfg&&window.SB.papel!=='parceiro'&&n>(S.cfg.ultimoPed||0))S.cfg.ultimoPed=n;return 'P-'+n}const n=Math.max((S.cfg&&S.cfg.ultimoPed)||2600,...S.pedidos.map(p=>{const v=+p.id.slice(2)||0;return v<100000?v:0}),...S.orcamentos.map(p=>+p.id.slice(2)||0))+1;if(S.cfg)S.cfg.ultimoPed=n;return 'P-'+n};
function resumo(pecas){
 const parts=[];const cont={};
 const ter=pecas.filter(p=>p.grupo==='Terno'&&p.tipo==='paleto').length,cos=pecas.filter(p=>p.grupo==='Costume'&&p.tipo==='paleto').length;
 if(ter)parts.push(ter>1?ter+' ternos':'Terno');if(cos)parts.push(cos>1?cos+' costumes':'Costume');
 pecas.filter(p=>!p.grupo).forEach(p=>{cont[p.tipo]=(cont[p.tipo]||0)+1});
 Object.entries(cont).forEach(([k,v])=>parts.push(v>1?`${v} ${PLUR[k]}`:TIPOS_P[k]));
 return parts.join(' + ');
}
const ATV=[
 {k:'metr',t:'Confirmar a metragem (tecido com padronagem)'},
 {k:'tecido',t:'Pedido do tecido ao fornecedor'},
 {k:'forro',t:'Pedido do forro ao fornecedor'},
 {k:'confped',t:'Confirmação do pedido'},
 {k:'penv',t:'Pedido enviado'},
 {k:'chegou',t:'Pedido recebido'},
 {k:'ficha',t:'Lançar pedido / enviar ficha'},
 {k:'env',t:'Tecido enviado para a produção'},
 {k:'rec',t:'Produção recebeu o tecido'},
 {k:'pronta',t:'Peça recebida do prestador'},
 {k:'agprova',t:'Prova / entrega agendada',modal:1},
 {k:'prova',t:'Prova / entrega realizada'},
 {k:'ajenv',t:'Enviada para ajuste'},
 {k:'ajret',t:'Voltou do ajuste'},
 {k:'agprova2',t:'Nova prova / entrega agendada',modal:1},
 {k:'ajuste',t:'Ajustes pós-prova'},
 {k:'aprov',t:'Aprovada pelo cliente'},
 {k:'dtent',t:'Combinar a entrega com o cliente',modal:1},
 {k:'entregue',t:'Entregue ao cliente'}
];
const tecOrig=pc=>pc.tecOrig||(pc.forn==='Interno'?'estoque':'comprar');
const semCompra=pc=>pc.tecOrig?pc.tecOrig!=='comprar':pc.forn==='Interno';
const ajOn=pc=>!!pc.op&&pc.agTipo!=='entrega';
const aplica=(pc,k)=>{
 if(pc.isOS){
  if(k==='tecido'||k==='chegou')return !!(pc.tecNeed&&pc.tecOrig==='comprar');
  if(k==='ajenv'||k==='ajret'||k==='agprova2'||k==='agprova'||k==='prova')return !!pc.precisaProva;
  if(k==='aprov')return true;
  return false;
 }
 if(k==='metr')return !!pc.pad;
 if(k==='confped'||k==='penv')return !!pc.op&&!semCompra(pc);
 if(k==='ajenv'||k==='ajret'||k==='agprova2')return ajOn(pc);
 if(pc.op&&(k==='dtent'||k==='ajuste'))return false;
 if(k==='aprov')return !!pc.op;
 if(k==='tecido'||k==='chegou')return !semCompra(pc);
 if(k==='forro')return temForro(pc)&&!!pc.forroForn&&pc.forroForn!=='Interno';
 if(k==='agprova'||k==='prova')return pc.op?true:!!pc.prova;
 if(k==='ajuste')return !!pc.prova;
 return true};
const feita=(p,pc,k)=>{
 if(pc.isOS&&(k==='tecido'||k==='chegou')){
  /* Confirmação manual (quando a compra foi resolvida fora da fila formal de Compras) tem prioridade;
     sem override manual, cai no status automático vindo do Pedido de Compra vinculado. */
  const manual=(p.atv[pc.uid]||{})[k];
  if(manual!==undefined)return manual;
  return osTecStatus(pc)==='recebido'?true:(k==='tecido'?(pc.tecPedido||undefined):undefined);
 }
 return (p.atv[pc.uid]||{})[k]
};
const pedFin=p=>!!(p.pecas&&p.pecas.length&&p.pecas.every(pc=>feita(p,pc,'entregue')));
const aberto=p=>p.pecas?!pedFin(p):p.st<4;
const setF=(p,pc,k,v)=>{p.atv[pc.uid]=p.atv[pc.uid]||{};if(v)p.atv[pc.uid][k]=v;else delete p.atv[pc.uid][k]};
const etapaPeca=(p,pc)=>{const f=k=>aplica(pc,k)&&feita(p,pc,k);
 if(feita(p,pc,'entregue'))return['Entregue','ok'];
 if(f('aprov'))return['Aprovada pelo cliente','ok'];
 if(pc.op){
  if(ajOn(pc)){if(f('agprova2'))return['Nova prova / entrega agendada','info'];if(f('ajret'))return['Voltou do ajuste','info'];if(f('ajenv'))return['Em ajuste','warn']}
  if(f('prova'))return[pc.agTipo==='entrega'?'Entrega realizada, falta confirmar':'Prova realizada, falta ajuste','info'];
  if(f('agprova'))return[pc.agTipo==='entrega'?'Entrega agendada':'Prova agendada','info'];
  if(f('pronta'))return['Pronta, aguardando prova','info'];
  const ch=!aplica(pc,'chegou')||feita(p,pc,'chegou'),fi=feita(p,pc,'ficha');
  if(ch&&fi){
   if(f('rec'))return['Em produção','info'];
   if(f('env'))return['Tecido enviado, aguardando confirmação da produção','info'];
   return['Ficha e tecido prontos, enviar para a produção','warn'];
  }
  if(fi)return['Ficha enviada, aguardando tecido','info'];
  if(ch&&aplica(pc,'chegou'))return['Tecido recebido, falta lançar a ficha','warn'];
  if(f('penv'))return['Pedido enviado pelo fornecedor','info'];
  if(f('confped'))return['Pedido confirmado','info'];
  if(f('tecido'))return['Aguardando confirmação do pedido','warn'];
  return['Pedir o tecido','warn'];
 }
 if(feita(p,pc,'pronta'))return['Pronta','ok'];
 if(f('ajuste'))return['Ajustes concluídos','info'];
 if(f('prova'))return['Prova realizada','info'];
 if(f('agprova'))return['Prova agendada','info'];
 if(feita(p,pc,'rec')||(!aplica(pc,'tecido')&&feita(p,pc,'env')))return['Em produção','info'];
 if(feita(p,pc,'env'))return['Tecido enviado para a produção','info'];
 if(f('chegou'))return['Tecido recebido','info'];
 if(f('tecido'))return['Tecido pedido, aguardando','warn'];
 return['Tecido a pedir','warn']};
const addUteis=(d,n)=>{let x=new Date(d+'T12:00:00');let i=0;while(i<n){x.setDate(x.getDate()+1);const w=x.getDay();if(w!==0&&w!==6)i++}return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const datF=(p,pc,k)=>{const v=feita(p,pc,k);return typeof v==='string'&&/^\d{4}-/.test(v)?v:null};
const SLA_DEF={maria:{d:15,g:'max'},adriano:{d:15,g:'max'},wgt:{d:20,g:'chegou'}};
const slaPrest=()=>S.cfg.slaPrest||(S.cfg.slaPrest=JSON.parse(JSON.stringify(SLA_DEF)));
const prevPronta=(p,pc)=>{
 if(!pc.op||feita(p,pc,'pronta'))return null;
 const sla=slaPrest()[pc.prest];if(!sla)return null;
 const fi=datF(p,pc,'ficha'),ch=aplica(pc,'chegou')?datF(p,pc,'chegou'):null;
 let base=null;
 if(sla.g==='chegou')base=ch;
 else if(aplica(pc,'chegou')){if(fi&&ch)base=fi>ch?fi:ch}
 else base=fi;
 return base?addDias(base,sla.d):null;
};
const prevAjuste=(p,pc)=>{if(!ajOn(pc)||feita(p,pc,'ajret'))return null;const d=datF(p,pc,'ajenv');return d?addUteis(d,5):null};
const modalVer=(p,pc)=>pc.modv?`<div class="d">Modelagem V${pc.modv} · ${(pc.modo==='camisa'||pc.modo==='peca')?'medida da peça':'medidas do corpo'}</div>`:'';
function ocorrenciaModal(p,pc){
 modal('Ocorrência · '+pecaNome(pc),`<p class="full" style="margin:0;color:var(--ink-2);font-size:14px">Registre o que mudou nesta peça: atraso do tecido, troca de material, prova remarcada, qualquer aviso.</p>
  <label>Data<input id="oc-d" class="ctl" type="date" value="${hoje()}"></label>
  <label class="full">O que aconteceu *<textarea id="oc-t" class="ctl" rows="3" placeholder="Ex.: fornecedor avisou que o tecido chega só dia 12"></textarea></label>`,()=>{
  const t=document.getElementById('oc-t').value.trim();if(!t)return 'Escreva o que aconteceu.';
  pc.notas=pc.notas||[];pc.notas.push({data:document.getElementById('oc-d').value||hoje(),txt:t});render();toast('Ocorrência registrada')},'Registrar')}
function prog(p){let a=0,b=0;p.pecas.forEach(pc=>ATV.forEach(x=>{if(aplica(pc,x.k)){b++;if(feita(p,pc,x.k))a++}}));return [a,b]}
function recalc(p,pcOrigem){
 syncGrupo(p,pcOrigem);
 const stg=pc=>pc.op?((feita(p,pc,'entregue')||feita(p,pc,'aprov'))?4:feita(p,pc,'prova')?3:feita(p,pc,'pronta')?2:(feita(p,pc,'ficha')&&(feita(p,pc,'chegou')||!aplica(pc,'chegou')))?1:0):feita(p,pc,'pronta')?4:(aplica(pc,'prova')&&feita(p,pc,'prova'))?3:(feita(p,pc,'rec')||!aplica(pc,'tecido')&&feita(p,pc,'env'))?((aplica(pc,'prova')&&feita(p,pc,'agprova'))?2:1):0;
 p.st=Math.min(...p.pecas.map(stg));
 const ag=p.pecas.map(pc=>pc.op?((feita(p,pc,'entregue')||feita(p,pc,'aprov'))?null:(ajOn(pc)&&feita(p,pc,'agprova2'))?feita(p,pc,'agprova2'):(feita(p,pc,'agprova')&&!feita(p,pc,'prova'))?feita(p,pc,'agprova'):null):(aplica(pc,'agprova')&&feita(p,pc,'agprova')&&!feita(p,pc,'prova'))?feita(p,pc,'agprova'):null).filter(x=>typeof x==='string').sort();
 p.prova=ag[0]||null;
}
function pcCtl(p,pc){
 if(!pc.op)return `<label class="chk pv"><input type="checkbox" data-pv="${pc.uid}" ${pc.prova?'checked':''}>Prova</label>`;
 const k=p.id+'|'+pc.uid,o=tecOrig(pc);
 return `<div class="pcctl"><label>Tecido<select class="ctl sm" data-orig="${k}" data-nosearch><option value="comprar" ${o==='comprar'?'selected':''}>Comprar</option><option value="estoque" ${o==='estoque'?'selected':''}>Estoque (sem compra)</option><option value="cliente" ${o==='cliente'?'selected':''}>Cliente trouxe</option></select></label>${feita(p,pc,'agprova')?`<label>Agendado como<select class="ctl sm" data-agt="${k}" data-nosearch><option value="prova" ${pc.agTipo!=='entrega'?'selected':''}>Prova</option><option value="entrega" ${pc.agTipo==='entrega'?'selected':''}>Entrega</option></select></label>`:''}</div>`;
}
function bindPcCtl(){
 const get=v=>{const [id,u]=v.split('|');const p=S.pedidos.find(x=>x.id===id);return [p,p.pecas.find(x=>x.uid===+u)]};
 document.querySelectorAll('[data-orig]').forEach(b=>b.onchange=()=>{const [p,pc]=get(b.dataset.orig);pc.tecOrig=b.value;if(b.value==='comprar'&&pc.forn==='Interno')toast('Defina o fornecedor do tecido em Editar pedido para lançar a compra.');recalc(p,pc);render()});
 document.querySelectorAll('[data-agt]').forEach(b=>b.onchange=()=>{const [p,pc]=get(b.dataset.agt);pc.agTipo=b.value;recalc(p,pc);render();toast(b.value==='entrega'?'Marcado como entrega: ajustes pós-prova dispensados.':'Marcado como prova: ajustes pós-prova liberados.')});
}
function fichaPeca(pc,i,cid){
 const l=[['Tecido',`${pc.forn||'—'} ${pc.tec||'(código a definir)'}${pc.etiq?' · '+pc.etiq:''}`]];
 if(pc.prod)l.unshift(['Produto',pc.prod]);
 if(pc.modv)l.push(['Modelagem',`V${pc.modv} · ${(pc.modo==='camisa'||pc.modo==='peca')?'medida da peça':'medidas do corpo'}`]);
 if((pc.subs||[]).length)l.push(['Tecido substituído',pc.subs.map(x=>`${x.de.forn} ${x.de.tec} → ${x.para.forn} ${x.para.tec}${x.motivo?' ('+x.motivo+')':''}`).join('\n')]);
 if(temForro(pc))l.push(['Forro',`${pc.forroForn||'—'} ${pc.forroCod||''}`]);
 
 CARAC[pc.tipo].forEach(g=>{const c=pc.car[g.id]||{};const v=camVisivel(g,pc).filter(f=>c[f.k]).map(f=>`${f.l}: ${c[f.k]}`);if(v.length)l.push([g.t,v.join('\n')])});
 if(pc.info)l.push(['Observações',pc.info]);
 return {t:`Peça ${i+1} · ${pecaNome(pc)}`,l};
}
const fichaHTML=(p,pc,i)=>{const f=fichaPeca(pc,i,p.cli);return `<div class="ficha"><b>${f.t}</b><dl>${f.l.map(([a,b])=>`<dt>${a}</dt><dd style="white-space:pre-line">${esc(b)}</dd>`).join('')}</dl></div>`};

function croquiCtx(doc,x,y,w,h,lw,zoom,cx,cy){
 zoom=zoom||1;cx=cx==null?50:cx;cy=cy==null?65:cy;
 const s=Math.min(w/100,h/130)*zoom;
 const X=v=>x+w/2+(v-cx)*s,Y=v=>y+h/2+(v-cy)*s;
 doc.setLineWidth(lw);doc.setDrawColor(38,48,44);doc.setFillColor(255,255,255);
 const mir=pts=>pts.map(([a,b])=>[100-a,b]);
 const g={
  s,X,Y,
  poly(pts,st){st=st||'FD';const seg=[];for(let i=1;i<pts.length;i++)seg.push([(pts[i][0]-pts[i-1][0])*s,(pts[i][1]-pts[i-1][1])*s]);doc.lines(seg,X(pts[0][0]),Y(pts[0][1]),[1,1],st,true)},
  path(st0,segs,st,closed){let [px,py]=st0;const out=[];for(const sg of segs){
    if(sg[0]==='L'){out.push([(sg[1]-px)*s,(sg[2]-py)*s]);px=sg[1];py=sg[2]}
    else if(sg[0]==='C'){out.push([(sg[1]-px)*s,(sg[2]-py)*s,(sg[3]-px)*s,(sg[4]-py)*s,(sg[5]-px)*s,(sg[6]-py)*s]);px=sg[5];py=sg[6]}
    else{const x1=sg[1],y1=sg[2],ex=sg[3],ey=sg[4];out.push([(px+2/3*(x1-px)-px)*s,(py+2/3*(y1-py)-py)*s,(ex+2/3*(x1-ex)-px)*s,(ey+2/3*(y1-ey)-py)*s,(ex-px)*s,(ey-py)*s]);px=ex;py=ey}}
    doc.lines(out,X(st0[0]),Y(st0[1]),[1,1],st||'S',!!closed)},
  line(a,b,c,d,dash){if(dash)doc.setLineDash([1,1],0);doc.line(X(a),Y(b),X(c),Y(d));if(dash)doc.setLineDash([],0)},
  circ(a,b,r,fill){doc.circle(X(a),Y(b),r*s,fill?'FD':'S')},
  thin(fn){const l=doc.getLineWidth();doc.setLineWidth(l*.6);fn();doc.setLineWidth(l)},
  text(t,a,b,size,style){doc.setFont('times',style||'italic');doc.setFontSize(size*s*2.83);doc.setTextColor(38,48,44);doc.text(String(t),X(a),Y(b),{align:'center'})},
  both(pts,st){g.poly(pts,st);g.poly(mir(pts),st)},
  clip(){doc.saveGraphicsState();doc.rect(x,y,w,h,null);doc.clip();doc.discardPath()},
  unclip(){doc.restoreGraphicsState()}
 };
 return g;
}

/* Orçamento em PDF: a proposta comercial que vai pro cliente. Formato de carta, no espírito do
   modelo que o Luiz já usa (saudação, tabela peça/qtde/valor com as personalizações de cada peça,
   condições e assinatura) — só que mais sofisticado: tipografia serifada nos números e no nome,
   peças de um mesmo conjunto (ex.: paletó+calça do terno) somadas numa única linha com preço
   único, e uma faixa de rodapé igual à das fichas de produção, pra fechar com a mesma identidade. */
const TITULOS_NOME=['sr','sr.','sra','sra.','dr','dr.','dra','dra.','srta','srta.'];
const primeiroNome=n=>{const ps=String(n||'').trim().split(/\s+/);let i=0;while(i<ps.length-1&&TITULOS_NOME.includes(ps[i].toLowerCase()))i++;return ps[i]||n};
function linhasOrcamento(pecas){
 /* acrescenta o tipo do tecido ao nome do item (ex.: "Paletó em lã fria", "Camisa em algodão egípcio"),
    lendo do catálogo (campo "tipo" cadastrado em Tecidos e forros). Quando o campo vem com uma categoria
    e o material juntos (ex.: "Camisaria · algodão"), mostra só a parte depois do · — fica "em algodão"
    em vez de "em camisaria · algodão". Sem tecido cadastrado ainda, o nome fica como estava. */
 const tipoTec=(forn,tec)=>{const r=tecRef(forn,tec,'tecidos');if(!r||!r.tipo)return '';const partes=r.tipo.split(' · ');return (partes[partes.length-1]||'').trim()};
 const comNome=(nome,forn,tec)=>{const t=tipoTec(forn,tec);return t?`${nome} em ${t.charAt(0).toLowerCase()+t.slice(1)}`:nome};
 const visiveis=pecas.filter(p=>!incluso(p));
 /* lote de tecidos: o item principal e os outros tecidos lançados nele viram uma única linha no
    orçamento (ex.: "3× Camisa Linha Business"), com os tecidos de cada um listados abaixo — em vez
    de uma linha cheia por tecido, que ficava repetitiva. */
 const brutas=[];
 visiveis.forEach(a=>{
  if(a.lote&&visiveis.some(x=>x.uid===a.lote))return; // tecido do lote: entra junto com o principal, abaixo
  const membros=visiveis.filter(x=>x.lote===a.uid);
  if(membros.length){
   const todos=[a,...membros],soma=todos.reduce((s,x)=>s+numBR(x.preco),0);
   brutas.push({nome:a.grupo||TIPOS_P[a.tipo]||a.tipo,preco:soma,unit:soma/todos.length,qtd:todos.length,isGrupo:false,
    tecidos:todos.map(x=>`${x.forn||''} ${x.tec||''}`.trim()).filter(Boolean)});
   return;
  }
  brutas.push({nome:comNome(a.grupo||(TIPOS_P[a.tipo]||a.tipo),a.forn,a.tec),preco:numBR(a.preco),tec:a.tec||'',forn:a.forn||'',isGrupo:!!a.grupo});
 });
 /* peças avulsas idênticas (mesmo tipo, tecido e preço, sem fazer parte de um conjunto) somam
    quantidade numa linha só — igual ao padrão do Luiz (ex.: "Camisa social · 8 · $1.200" cada). */
 const out=[];
 brutas.forEach(l=>{
  if(l.tecidos){out.push({nome:l.nome,unit:l.unit,preco:l.preco,qtd:l.qtd,isGrupo:false,tecidos:l.tecidos});return}
  if(!l.isGrupo){
   const m=out.find(o=>!o.isGrupo&&!o.tecidos&&o.nome===l.nome&&o.tec===l.tec&&o.forn===l.forn&&o.unit===l.preco);
   if(m){m.qtd++;m.preco=m.unit*m.qtd;return}
   out.push({nome:l.nome,tec:l.tec,forn:l.forn,unit:l.preco,preco:l.preco,qtd:1,isGrupo:false});
  }else out.push({nome:l.nome,unit:l.preco,preco:l.preco,qtd:1,isGrupo:true});
 });

/* window.print() às vezes é bloqueado silenciosamente (sem erro nenhum) dentro do sandbox

   se nem o evento 'beforeprint' disparar em menos de 1s, avisamos e sugerimos o PDF. */

 const onBefore=()=>{abriu=true};
 const onAfter=()=>limpa();
 window.addEventListener('beforeprint',onBefore);window.addEventListener('afterprint',onAfter);
 try{window.print()}catch(e){}

/* ===== Ordem de produção: agrupa fichas pendentes de envio por ateliê/prestador, cruzando pedidos diferentes ===== */
/* Agrupa por conjunto (gid), não por peça solta: paletó+calça+colete de um mesmo terno sempre vão para o mesmo ateliê
   e compartilham o checklist (syncGrupoChecklist copia o estado da peça-âncora para as demais do grupo), então
   marcar "ficha enviada" em só parte de um conjunto seria desfeito por esse sync. Cada item de opGrupos() já é o
   conjunto inteiro (pcs = todas as peças daquele gid, ou só a peça mesmo quando ela não faz parte de um conjunto). */
function opGrupos(){
 const out={};
 S.pedidos.filter(p=>p.pecas&&p.status==='producao').forEach(p=>{
  const porGrupo={};
  p.pecas.forEach(pc=>{if(pc.prest&&aplica(pc,'ficha')&&!feita(p,pc,'ficha'))(porGrupo[pc.gid||pc.uid]=porGrupo[pc.gid||pc.uid]||[]).push(pc)});
  Object.values(porGrupo).forEach(pcs=>(out[pcs[0].prest]=out[pcs[0].prest]||[]).push({p,pcs}));
 });
 return out;
}

function crudModal(k,r){

  const o={};

   if(f.money&&v&&!/^\d+(\.\d{3})*(,\d{1,2})?$/.test(v))return 'Valor inválido. Use números, como 1.890,00.';
   if(f.uniq&&S.cfg[k].some(x=>x!==r&&String(x[f.k]).toLowerCase()===v.toLowerCase()))return `Já existe um registro com este valor em "${f.l}".`;
   o[f.k]=v}
  if(k==='servicos'&&S.cfg.servicos.some(x=>x!==r&&x.nome.toLowerCase()===o.nome.toLowerCase()&&(x.tipo||'Qualquer peça')===o.tipo))return 'Este serviço já existe para essa peça.';

  o.ativo=document.getElementById('cf-ativo').checked;
  if(r){
   if(k==='industrias'&&r.nome!==o.nome)refsAll().forEach(x=>{if(x.ind===r.nome)x.ind=o.nome});
   if(k==='tipostec'&&r.nome!==o.nome)refsAll().forEach(x=>{if(x.tipo===r.nome)x.tipo=o.nome});
   if(k==='bancos'&&r.nome!==o.nome)S.cfg.contas.forEach(c=>{if(c.banco===r.nome)c.banco=o.nome});
   Object.assign(r,o)}
  else S.cfg[k].push(Object.assign({id:nid()},o));
  toast(r?'Cadastro salvo':'Cadastrado');
 },'Salvar',r&&!r.sistema?{msg:'Excluir este cadastro?',ok:'Cadastro excluído',run:()=>{
  const em=(n,t)=>n?`Não dá para excluir: ${n} ${t} este cadastro. Desmarque “Ativo” para tirar da lista.`:'';
  let m='';
  if(k==='bancos')m=em(S.cfg.contas.filter(c=>c.banco===r.nome).length,'conta usa');
  if(k==='industrias')m=em(refsAll().filter(x=>x.ind===r.nome).length,'referência de tecido usa');
  if(k==='tipostec')m=em(refsAll().filter(x=>x.tipo===r.nome).length,'referência de tecido usa');
  if(k==='usuarios'){if(P.user&&P.user.id===r.id)m='Você não pode excluir o próprio usuário.';else if(r.grupo==='Administrador'&&S.cfg.usuarios.filter(u=>u.grupo==='Administrador'&&u!==r).length===0)m='É o único administrador. Crie outro antes.'}
  if(m)return m;
  S.cfg[k]=S.cfg[k].filter(x=>x!==r);
 }}:null);
 /* Máscara de valores: ao sair de qualquer campo "money" do cadastro, normaliza pra "1.800,00" */
 d.f.filter(f=>f.money).forEach(f=>{
  const el=document.getElementById('cf-'+f.k);
  if(!el)return;
  if(el.value)el.value=fmtMoneyStr(el.value);
  el.addEventListener('blur',()=>{if(el.value)el.value=fmtMoneyStr(el.value)});
 });
 if(k==='produtos'){
  const catEl=document.getElementById('cf-categoria'),nomeEl=document.getElementById('cf-nome');
  if(catEl&&nomeEl)catEl.addEventListener('change',()=>{

  });
 }
}

function comboCad(id,lista,cadastrar,fmt,cls){
 const inp=document.getElementById(id),dd=document.getElementById('dd-'+id);if(!inp)return;
 const fecha=()=>{dd.hidden=true};
 const abre=filtrar=>{const q=inp.value.trim(),f=filtrar?q:'';
  const L=lista().filter(x=>!f||semAcento(x).includes(semAcento(f))),ex=lista().some(x=>x.toLowerCase()===q.toLowerCase());
  const novo=q.length>=2&&!ex?`<button type="button" class="ddn" data-cc="new">+ Cadastrar "${esc(q)}"</button>`:'';
  dd.innerHTML=novo+L.map(x=>`<button type="button" class="ddi ${cls?cls(x):''}" data-cc="${esc(x)}">${esc(x)}</button>`).join('')||'<div class="hint" style="padding:10px 12px">Nada cadastrado ainda. Digite para cadastrar.</div>';
  dd.hidden=false;
  const r=inp.getBoundingClientRect(),abaixo=innerHeight-r.bottom-12,acima=r.top-12,sobe=abaixo<170&&acima>abaixo,h=Math.max(120,Math.min(240,sobe?acima:abaixo));
  Object.assign(dd.style,{position:'fixed',left:r.left+'px',width:r.width+'px',right:'auto',maxHeight:h+'px',top:sobe?'auto':(r.bottom+4)+'px',bottom:sobe?(innerHeight-r.top+4)+'px':'auto',marginTop:'0',zIndex:'1000'})};
 const mr=document.getElementById('modal-root');if(mr)mr.addEventListener('scroll',fecha,true);
 inp.addEventListener('focus',()=>abre(false));
 inp.addEventListener('click',()=>{if(dd.hidden)abre(false)});
 inp.addEventListener('input',()=>abre(true));
 inp.addEventListener('keydown',e=>{if(e.key==='Escape'){fecha()}else if(e.key==='Enter'&&!dd.hidden){const b=dd.querySelector('[data-cc]');if(b){e.preventDefault();b.click()}}});
 dd.addEventListener('mousedown',e=>e.preventDefault());
 dd.addEventListener('click',e=>{const b=e.target.closest('[data-cc]');if(!b)return;
  if(b.dataset.cc==='new'){const n=(fmt||(x=>x))(inp.value.trim());cadastrar(n);inp.value=n}else inp.value=b.dataset.cc;fecha()});
 inp.addEventListener('blur',()=>setTimeout(fecha,150));
}

function lerForn(idAtual){
 const g=id=>(document.getElementById(id)?.value||'').trim();
 const tipos=['Tecido','Forro','Prestador','Outro'].filter(t=>document.getElementById('fz-tipo-'+t)?.checked);
 const fantasia=g('fz-fantasia');
 if(!fantasia)return {err:'Informe o nome fantasia.',foco:'fz-fantasia'};
 if(S.fornecedores.some(x=>x.id!==idAtual&&x.fantasia.toLowerCase()===fantasia.toLowerCase()))return {err:'Já existe um fornecedor com este nome.',foco:'fz-fantasia'};
 if(!tipos.length)return {err:'Marque ao menos um tipo de fornecedor.'};
 const prestCat=['Alfaiataria','Camisaria'].filter(c=>document.getElementById('fz-pcat-'+c)?.checked);
 if(tipos.includes('Prestador')&&!prestCat.length)return {err:'Marque ao menos um tipo de serviço (alfaiataria ou camisaria) para o prestador.'};
 const pj=g('fz-pj')==='pj',doc=g('fz-doc');
 if(doc&&(pj?!cnpjOk(doc):!cpfOk(doc)))return {err:(pj?'CNPJ':'CPF')+' inválido. Confira os números.',foco:'fz-doc'};
 const tel=g('fz-tel');if(tel&&tel.replace(/\D/g,'').length<10)return {err:'Telefone incompleto. Informe o DDD e o número.',foco:'fz-tel'};
 const emails=[...document.querySelectorAll('.emrow')].map(r=>({tipo:r.querySelector('.fz-et').value,email:r.querySelector('.fz-em').value.trim()})).filter(e=>e.email);
 const bad=emails.find(e=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e.email));
 if(bad)return {err:'E-mail inválido: '+bad.email};
 const atual=idAtual?S.fornecedores.find(x=>x.id===idAtual):null;
 const prestKey=tipos.includes('Prestador')?(atual&&atual.prestKey?atual.prestKey:slugPrest(fantasia,new Set(S.fornecedores.filter(x=>x.id!==idAtual&&x.prestKey).map(x=>x.prestKey)))):(atual?atual.prestKey:undefined);
 return {data:{tipos,fantasia,pj,doc,razao:g('fz-razao'),ie:g('fz-ie'),tel,contato:g('fz-contato'),end:g('fz-end'),comp:g('fz-comp'),bairro:g('fz-bairro'),cep:g('fz-cep'),cidade:g('fz-cid'),uf:g('fz-uf').toUpperCase(),obs:g('fz-obs'),emails,ativo:document.getElementById('fz-ativo').checked,prestKey,prestCat:tipos.includes('Prestador')?prestCat:undefined}};
}

function renomearForn(de,para){

 [...S.pedidos,...S.orcamentos].forEach(p=>(p.pecas||[]).forEach(pc=>{if(pc.forn===de)pc.forn=para;if(pc.forroForn===de)pc.forroForn=para}));

}

 const pedsPrest=f.prestKey?[...S.pedidos,...S.orcamentos].filter(o=>(o.pecas||[]).some(x=>x.prest===f.prestKey)):[];
 if(peds.length||pag.length||pedsPrest.length){modal('Não dá para excluir',`<p class="full" style="margin:0"><b>${esc(nome)}</b> aparece em ${plural(peds.length+pedsPrest.length,'pedido','pedidos')}${pag.length?` e ${plural(pag.length,'lançamento a pagar','lançamentos a pagar')}`:''}. Para tirar da lista de escolha, edite o cadastro e desmarque “Fornecedor ativo”.</p>`,null);return}

/* Rastreia o tecido comprado para uma OS: null/undefined = não se aplica (não precisa tecido, ou origem é estoque/cliente);
   'pendente' = precisa comprar mas ainda não entrou na fila de Compras; 'pedido' = já pedido ao fornecedor, aguardando nota fiscal;
   'recebido' = nota fiscal já lançada na Pedido de Compra correspondente. */
function osTecStatus(o){
 if(!o.tecNeed||o.tecOrig!=='comprar')return null;
 if(!o.tecPedido)return 'pendente';
 const pcomp=S.pedidosCompra.find(x=>x.itens.some(it=>it.osId===o.id));
 return (pcomp&&pcomp.status==='recebido')?'recebido':'pedido';
}
/* Dá à OS a mesma "forma" de uma peça de pedido para reaproveitar feita/setF/colDe/moveCard
   (o próprio objeto da OS funciona como "p" e "pc" ao mesmo tempo: o.atv[o.uid] guarda o checklist). */
function osEnsure(o){
 if(!o.atv)o.atv={};
 if(o.uid===undefined)o.uid=o.id;
 o.isOS=true;
 if(o.precisaProva===undefined)o.precisaProva=false;
 return o;
}
/* Mantém a etapa simples da OS (o.st 0-3, usada na tela de Produção) alinhada com a coluna
   do quadro de Atividades (derivada do checklist/prova/ajuste), reaproveitando osEtapa. */
function syncOSSt(o){
 const col=colDe(o,o),target=col==='entregue'?3:col==='pronto'?2:col==='prep'?0:1;
 if(o.st!==target)osEtapa(o,target,{});
}

 </div>

   tecNeed,forn:tecNeed?g('os-tforn'):'',tec:tecNeed?codeDe(g('os-tref'),g('os-tcor')):'',metr:tecNeed?g('os-tmetr'):'',tecOrig:tecNeed?document.getElementById('os-torig').value:'comprar',tecRepassar:tecNeed&&document.getElementById('os-trepassar').checked,
   precisaProva:document.getElementById('os-provaneed').checked};
  if(!tecNeed||dados.tecOrig!=='comprar'){dados.tecPedido=null} // saiu da fila de compras: reseta o rastreio de "já pedido"
  else if(o&&o.tecPedido)dados.tecPedido=o.tecPedido; // mantém o rastreio se já tinha sido marcado como pedido
  if(o){const stN=+document.getElementById('os-st').value,gd=id=>document.getElementById(id).value;
   Object.assign(o,dados);
   const e2=osEtapa(o,stN,{env:gd('os-env'),pronta:gd('os-pronta'),ent:gd('os-ent')});if(e2)return e2;
   // datas editadas manualmente valem
   if(stN>=1&&gd('os-env'))o.env=gd('os-env');if(stN>=2&&gd('os-pronta'))o.pronta=gd('os-pronta');if(stN>=3&&gd('os-ent'))o.ent=gd('os-ent');
   // realinha o checklist/prova/ajuste do quadro de Atividades com a etapa escolhida aqui
   if(stN<2){setF(o,o,'pronta',null);setF(o,o,'prova',null);setF(o,o,'agprova',null);setF(o,o,'ajenv',null);setF(o,o,'ajret',null);setF(o,o,'agprova2',null);setF(o,o,'aprov',null);setF(o,o,'entregue',null)}
   else if(stN===2){setF(o,o,'aprov',null);setF(o,o,'entregue',null);if(!feita(o,o,'pronta'))setF(o,o,'pronta',o.pronta||hoje())}
   else if(stN===3){if(!feita(o,o,'pronta'))setF(o,o,'pronta',o.pronta||hoje());setF(o,o,'aprov',o.ent||hoje());setF(o,o,'entregue',o.ent||hoje())}
  }
  else{S.os.push(osEnsure(Object.assign({id:osNext(),entrada:hoje(),st:0},dados)))}
  toast(o?'Ordem de serviço salva':'Ordem de serviço criada');
 },'Salvar',o?{msg:()=>`Excluir ${o.id}${S.receber.some(r=>r.os===o.id)?' e a cobrança lançada no Financeiro':''}?`,run:()=>{S.os=S.os.filter(x=>x!==o);S.receber=S.receber.filter(r=>r.os!==o.id)},ok:'Ordem de serviço excluída'}:null);
 const inp=document.getElementById('os-serv'),box=document.getElementById('os-newserv'),bt=document.getElementById('os-newserv-b');
 const tp=()=>document.getElementById('os-tipo').value;
 const achar=t=>S.cfg.servicos.find(x=>x.nome.toLowerCase()===t.trim().toLowerCase()&&servTipoOk(x,tp()));
 const sugs=()=>{document.getElementById('os-sug').innerHTML=[...new Set(S.cfg.servicos.filter(x=>x.ativo&&servTipoOk(x,tp())).map(x=>x.nome))].map(n=>`<option value="${esc(n)}">`).join('')};
 document.getElementById('os-tipo').addEventListener('change',()=>{sugs();upd()});
 const upd=()=>{const t=inp.value.trim();box.hidden=!t||!!achar(t);bt.textContent=`Cadastrar serviço "${t}"`};
 inp.addEventListener('input',()=>{upd();const sv=achar(inp.value),vv=document.getElementById('os-valor');if(sv&&sv.valor&&!vv.value.trim())vv.value=sv.valor});
 bt.onclick=()=>{const t=inp.value.trim().replace(/\s+/g,' ');if(!t||achar(t))return;S.cfg.servicos.push({id:nid(),nome:t,tipo:TIPOS_P[tp()]||'Qualquer peça',valor:'',ativo:true});toast('Serviço cadastrado: '+t+'. Defina o valor padrão em Configurações.');upd()};
 upd();

 const tforn=document.getElementById('os-tforn'),tref=document.getElementById('os-tref'),tsug=document.getElementById('os-tref-sug'),tcor=document.getElementById('os-tcor'),tcsug=document.getElementById('os-tcor-sug');
 const updCorOpts=()=>{const r=tforn.value&&tref.value?tecRef(tforn.value,tref.value,'tecidos'):null;tcor.disabled=!r;tcor.placeholder=r?'Ex.: Azul claro':'Informe a referência';tcsug.innerHTML=(r?r.cores:[]).map(c=>`<option value="${esc(c)}">`).join('')};
 tforn.onchange=()=>{tref.disabled=!tforn.value;tref.placeholder=tforn.value?'Ex.: F1-2210':'Escolha o fornecedor';if(!tforn.value){tref.value='';tcor.value=''}tsug.innerHTML=(S.cat.tecidos[tforn.value]||[]).map(r=>`<option value="${esc(r.ref)}">`).join('');updCorOpts()};
 tref.addEventListener('input',()=>{if(!tecRef(tforn.value,tref.value,'tecidos'))tcor.value='';updCorOpts()});
}
function osEtapa(o,st,d){
 d=d||{};const rc=S.receber.find(r=>r.os===o.id);
 if(st<3&&rc){if(rc.st==='pago')return 'A cobrança desta OS já consta como paga no Financeiro. Ajuste lá primeiro.';S.receber=S.receber.filter(r=>r!==rc)}
 o.st=st;
 if(st>=1)o.env=d.env||o.env||hoje();else delete o.env;
 if(st>=2)o.pronta=d.pronta||o.pronta||hoje();else delete o.pronta;
 if(st>=3){o.ent=d.ent||o.ent||hoje();
  if(o.valor>0&&!S.receber.some(r=>r.os===o.id))S.receber.push({id:'R'+nid(),cli:o.cli,desc:`${o.id} · ${o.servico}`,venc:hoje(),valor:o.valor,forma:'Pix',st:'aberto',os:o.id})}
 else delete o.ent;
 return '';
}
function osVoltar(o){
 if(!o||o.st<1)return;const de=OSST[o.st],para=OSST[o.st-1];
 const had=S.receber.some(r=>r.os===o.id&&r.st!=='pago');
 const err=osEtapa(o,o.st-1);if(err){toast(err);return}
 toast(`${o.id} voltou de “${de}” para “${para}”${had?'. Cobrança removida do Financeiro':''}`);
}
function osAvancar(o){
 const nome=cli(o.cli).nome;
 if(o.st===0&&osTecStatus(o)&&osTecStatus(o)!=='recebido'){toast('Aguardando o tecido chegar. Lance a nota fiscal da compra antes de '+(o.resp==='atelie'?'iniciar o serviço':'enviar ao responsável')+'.');return}
 if(o.st===0){o.st=1;o.env=hoje();toast(o.resp==='atelie'?'Serviço iniciado no ateliê':'Peça enviada para '+osResp(o.resp))}
 else if(o.st===1){o.st=2;o.pronta=hoje();toast('Pronta. Avise '+nome.split(' ')[0])}
 else if(o.st===2){o.st=3;o.ent=hoje();
  if(o.valor>0&&!S.receber.some(r=>r.os===o.id)){S.receber.push({id:'R'+nid(),cli:o.cli,desc:`${o.id} · ${o.servico}`,venc:hoje(),valor:o.valor,forma:'Pix',st:'aberto',os:o.id});toast('Entregue. Cobrança de '+brl(o.valor)+' lançada no Financeiro')}else toast('Entregue ao cliente')}
}

const SLA={tecido:2,forro:2,confped:4,penv:7,ficha:3,chegou:10,env:12,rec:14,metr:2};
function prazoPedido(p){if(!p.pecas||!p.pecas.length)return null;const vs=p.pecas.map(pc=>pc.prazo).filter(Boolean);return vs.length?vs.sort().slice(-1)[0]:null}
function prazoAtv(p,k){
 if(p.prazos&&p.prazos[k])return p.prazos[k];
 const base=p.aprov||p.dped,ent=prazoPedido(p);
 if(k in SLA)return addDias(base,SLA[k]);
 if(k==='agprova')return ent?addDias(ent,-15):addDias(base,7);
 if(k==='prova'){const a=p.pecas.map(pc=>feita(p,pc,'agprova')).filter(Boolean).sort()[0];return a||(ent?addDias(ent,-12):addDias(base,14))}
 if(k==='ajuste')return ent?addDias(ent,-7):addDias(base,18);
 if(k==='pronta'){const ds=p.pecas.map(pc=>prevPronta(p,pc)).filter(Boolean).sort();if(ds.length)return ds[0]}
 if(k==='ajret'){const ds=p.pecas.map(pc=>prevAjuste(p,pc)).filter(Boolean).sort();if(ds.length)return ds[0]}
 if(k==='ajenv')return ent?addDias(ent,-14):addDias(base,25);
 if(k==='agprova2'){const ds=p.pecas.map(pc=>datF(p,pc,'ajret')).filter(Boolean).sort();return ds.length?addDias(ds[0],2):(ent?addDias(ent,-5):addDias(base,28))}
 if(k==='aprov')return ent||addDias(base,30);
 if(k==='pronta')return ent?addDias(ent,-3):addDias(base,25);
 if(k==='dtent')return ent?addDias(ent,-10):addDias(base,20);
 if(k==='entregue')return ent||addDias(base,30);
 return addDias(base,7);
}
const AJK=['ajenv','ajret','agprova2'];
const atvAtrasadas=p=>p.pecas?ATV.filter(A=>p.pecas.some(pc=>aplica(pc,A.k)&&!feita(p,pc,A.k)&&(!AJK.includes(A.k)||feita(p,pc,'prova')))&&daysTo(prazoAtv(p,A.k))<0):[];
const pz=z=>{if(!z)return '';const n=daysTo(z);return n<0?`<span class="pill crit">Atrasado · venceu ${fd(z)}</span>`:n===0?'<span class="pill warn">Vence hoje</span>':n<=2?`<span class="pill warn">Prazo ${fd(z)}</span>`:`<span class="pill plain">Prazo ${fd(z)}</span>`};
function compraItens(){
 const out=[];
 S.pedidos.filter(p=>p.pecas&&p.status==='producao').forEach(p=>p.pecas.forEach((pc,i)=>{
  if(aplica(pc,'tecido')&&!feita(p,pc,'tecido'))out.push({p,pc,i,t:'tecido',forn:pc.forn,cod:pc.tec,f:'metr',key:`${p.id}|${pc.uid}|t`,kind:'pedido'});
  if(aplica(pc,'forro')&&!feita(p,pc,'forro'))out.push({p,pc,i,t:'forro',forn:pc.forroForn,cod:pc.forroCod,f:'metrF',key:`${p.id}|${pc.uid}|f`,kind:'pedido'});
 }));
 /* OS que precisam comprar tecido (ex.: substituir punho/manga) entram na mesma fila, agrupadas por fornecedor junto com os pedidos.
    x.pc é a própria OS (ela já tem forn/tec/metr/dest com os mesmos nomes de campo que a peça de pedido usa, então o resto do
    código de Compras funciona sem precisar saber a diferença); x.p é um pedido "de mentirinha" só para reaproveitar cli()/pagto. */
 S.os.filter(o=>o.tecNeed&&o.tecOrig==='comprar'&&!o.tecPedido).forEach(o=>{
  if(!o.dest)o.dest=o.resp;
  out.push({p:{id:o.id,cli:o.cli,pagto:true},pc:o,i:0,t:'tecido',forn:o.forn,cod:o.tec,f:'metr',key:`${o.id}|t`,kind:'os',osLabel:o.servico});
 });
 return out.sort((a,b)=>a.forn.localeCompare(b.forn)||a.cod.localeCompare(b.cod));
}
function compraTot(its){const tot={};its.filter(x=>ui.csel[x.key]).forEach(x=>{const k=(x.t==='forro'?'Forro ':'')+(x.cod||'sem código');tot[k]=(tot[k]||0)+num2(x.pc[x.f])});return `<b>Total por artigo:</b> ${Object.entries(tot).map(([k,v])=>`<span class="pill plain">${esc(k)} · ${fm(v)} m</span>`).join(' ')||'<span class="d">nenhum item marcado</span>'}`}

 ui.csel=ui.csel||{};its.forEach(x=>{if(!(x.key in ui.csel))ui.csel[x.key]=true});

 <p class="d" style="margin:0;color:var(--ink-2)">Tudo o que ainda precisa ser pedido, agrupado por fornecedor. Marque o que vai no pedido, confira a metragem e o destino, e gere o quadro para enviar.</p>
 ${forns.length?`<div class="seg" role="group" aria-label="Fornecedor" style="align-self:flex-start">${forns.map(f=>`<button data-cf="${esc(f)}" aria-pressed="${ui.cf===f}">${esc(f)} <span class="mono">${all.filter(x=>x.forn===f).length}</span></button>`).join('')}</div>

function lembretes(){
 const out=[];
 S.pedidos.filter(aberto).forEach(p=>{
  const c=cli(p.cli);
  if(p.pecas){
   const pp=prazoPedido(p),atr=pp&&daysTo(pp)<0;
   const pd=p.pecas.filter(pc=>pc.pad&&!feita(p,pc,'metr'));
   if(pd.length)out.push({u:1,p,k:'metr',prazo:prazoAtv(p,'metr'),t:`Confirmar a metragem dos cortes de ${c.nome} (${p.id}): tecido com padronagem, ${pd.length} ${pd.length>1?'peças':'peça'}.`});
   if(!p.pagto)return;
   const need=p.pecas.filter(pc=>aplica(pc,'agprova')&&!feita(p,pc,'agprova'));
   const marc=p.pecas.some(pc=>aplica(pc,'agprova')&&feita(p,pc,'agprova')&&!feita(p,pc,'prova'));
   if(marc&&atr)out.push({u:0,p,k:'atraso',prazo:pp,t:`${p.id} está atrasado. Avise ${c.nome} e reagende a prova de ${fd(p.prova)}.`});
   else if(need.length)out.push({u:1,p,k:'prova',prazo:prazoAtv(p,'agprova'),t:`Agendar a prova de ${c.nome} (${p.id}), ${need.length} ${need.length>1?'peças':'peça'}${pp?`. Sugestão: ${fd(addDias(pp,-12))}`:''}`});
   return;
  }
  const atr=p.entrega&&daysTo(p.entrega)<0;
  if(p.prova&&atr)out.push({u:0,p,k:'atraso',prazo:p.entrega,t:`${p.id} está atrasado. Avise ${c.nome} e reagende a prova de ${fd(p.prova)}.`});
  else if(!p.prova&&p.st<=2)out.push({u:atr?0:1,p,k:'prova',prazo:p.entrega?addDias(p.entrega,-15):addDias(p.dped||hoje(),7),t:`Agendar a prova de ${c.nome} (${p.id})${p.entrega?`. Sugestão: ${fd(addDias(p.entrega,-12))}`:''}`});
 });
 return out;
}
function pendencias(){

 S.os.filter(o=>o.st<3).forEach(o=>{const c=cli(o.cli).nome,r=osResp(o.resp),at=o.resp==='atelie';
  if(o.st===0)L.push({tipo:'os',o,t:`${o.id} · ${c}: ${at?'fazer o serviço':'enviar a peça para '+r}`,prazo:addDias(o.entrada,1)});
  else if(o.st===1)L.push({tipo:'os',o,t:`${o.id} · ${c}: ${at?'concluir o serviço':'buscar a peça com '+r}`,prazo:o.prazo});
  else L.push({tipo:'os',o,t:`${o.id} · ${c}: avisar que a peça está pronta e entregar`,prazo:o.prazo})});
 S.lembAv.forEach((a,i)=>{if(!a.done)L.push({tipo:'av',i,t:a.t,prazo:a.prazo||addDias(hoje(),7)})});
 /* Atraso de produção (prazo previsto de finalização pelo prestador já vencido) e risco de atraso
    na entrega (chegada prevista no ateliê depois do prazo combinado com o cliente) — por peça, só
    na peça âncora de cada conjunto pra não duplicar o mesmo alerta pro paletó/calça/colete. */
 S.pedidos.filter(p=>p.pecas&&aberto(p)).forEach(p=>{
  const c=cli(p.cli);
  p.pecas.filter(pc=>pc.op&&(!pc.gid||pc.gid===pc.uid)&&!feita(p,pc,'pronta')).forEach(pc=>{
   if(pc.prazoProd&&daysTo(pc.prazoProd)<0)L.push({tipo:'prodatraso',p,t:`${p.id} · ${pecaNome(pc)} de ${c.nome}: produção atrasada com ${PARCEIROS[pc.prest]||'o prestador'} (previsto ${fd(pc.prazoProd)})`,prazo:pc.prazoProd});

  });
 });
 return L.sort((a,b)=>a.prazo.localeCompare(b.prazo));
}

/* ===== Board de peças (estilo Trello) ===== */
/* "env"/"rec" valem para toda peça com ordem de produção, não importa a origem do tecido (comprado, estoque ou
   trazido pelo cliente): é a confirmação de que o tecido físico chegou onde a peça será costurada — seja na
   confecção interna (andar de baixo) ou num prestador externo (Maria, WGT). Antes dessa marcação existir, o
   sistema pulava direto de "ficha lançada" para "Em produção"; a migração em aplicarDados preserva isso para
   peças que já estavam nesse ponto. */
const PREP=[['ficha','Lançar e enviar a ficha'],['metr','Confirmar a metragem'],['tecido','Pedir o tecido'],['forro','Pedir o forro'],['confped','Confirmar o pedido'],['penv','Pedido enviado'],['chegou','Tecido recebido'],['env','Tecido enviado para a produção'],['rec','Produção recebeu o tecido']];
const prepKeys=pc=>PREP.filter(([k])=>aplica(pc,k));
const prepProg=(p,pc)=>{const ks=prepKeys(pc);return [ks.filter(([k])=>feita(p,pc,k)).length,ks.length]};
const PREP_KEYS=new Set(PREP.map(([k])=>k));
/* Peça para prova: quando um pedido tem mais de uma peça do mesmo tipo (ex.: 3 camisas), o Luiz pode marcar
   uma delas como a peça-piloto (pc.provaPeca) — é nela que a prova é feita primeiro. As demais peças do MESMO
   TIPO no mesmo pedido podem seguir normalmente todo o checklist de preparação (ficha, metragem, tecido, forro,
   pedido confirmado/enviado, tecido recebido), só não podem ser enviadas para a produção ('env') antes da prova
   da peça-piloto ser registrada — combinado com o Luiz em 25/11/2026. Depois que a prova da piloto é registrada
   (mesmo que ainda vá precisar de ajuste), as demais já podem seguir. Não se aplica a OS avulsa (sem p.pecas).*/
const pecaBloqueadaPorProva=(p,pc)=>{
 if(pc.provaPeca||!p.pecas)return false;
 const piloto=p.pecas.find(x=>x!==pc&&x.tipo===pc.tipo&&x.provaPeca);
 return !!piloto&&!feita(p,piloto,'prova');
};
/* Zera o progresso depois da preparação (pronto p/ prova, ajuste, aprovada, entregue): usado sempre que um item
   do checklist de preparação é desmarcado, pra a peça não "pular" de volta pra uma etapa que não é mais válida
   enquanto a preparação não for refeita. */
const clearProgresso=(p,pc)=>['pronta','prova','agprova','ajenv','ajret','aprov','entregue'].forEach(k=>setF(p,pc,k,null));
const COLS=[['prep','Em preparação'],['prod','Em produção'],['prova','Pronto para prova'],['ajuste','Em ajuste'],['pronto','Pronto para entrega']];
/* A preparação é pré-requisito de tudo: se algum item do checklist ainda está em aberto, a peça fica em
   "Em preparação" mesmo que marcações de etapas mais avançadas (pronta, aprovada...) ainda existam no histórico. */
const colDe=(p,pc)=>{
 const [a,b]=prepProg(p,pc);if(a<b)return 'prep';
 if(feita(p,pc,'entregue'))return 'entregue';
 if(feita(p,pc,'aprov'))return 'pronto';
 if(feita(p,pc,'ajenv')&&!feita(p,pc,'ajret'))return 'ajuste';
 if(feita(p,pc,'pronta'))return 'prova';
 return 'prod';
};
const colNome=c=>c==='entregue'?'Entregue':(COLS.find(x=>x[0]===c)||[0,c])[1];
function moveCard(p,pc,to){
 if(pc.isOS){
  const rc=S.receber.find(r=>r.os===pc.id);
  if(rc&&rc.st==='pago'&&to!=='entregue'){toast('A cobrança desta OS já consta como paga no Financeiro. Ajuste lá primeiro.');return false}
 }
 const cur=colDe(p,pc),T=hoje(),clr=(...ks)=>ks.forEach(k=>setF(p,pc,k,null));
 if(cur===to)return true;
 if(to==='prep')return false;
 if(to==='prod'){
  const [a,b]=prepProg(p,pc);if(a<b){toast('Conclua o checklist de preparação antes.');return false}
  clr('pronta','prova','agprova','ajenv','ajret','aprov','entregue');
 }else if(to==='prova'){
  if(cur==='prep'){toast('Conclua o checklist de preparação antes.');return false}
  if(cur==='ajuste')setF(p,pc,'ajret',T);
  else{clr('aprov','entregue');if(!feita(p,pc,'pronta'))setF(p,pc,'pronta',T)}

function bindDrag(){
 const board=document.querySelector('.kb');if(!board)return;
 const scroller=document.querySelector('.board-wrap')||board;
 board.querySelectorAll('.oc[data-card]').forEach(card=>{
  card.addEventListener('click',e=>{if(card._nc){e.stopImmediatePropagation();e.preventDefault()}},true);
  card.addEventListener('pointerdown',e=>{
   if(e.button>0||e.target.closest('button,a,input,select'))return;
   const sx=e.clientX,sy=e.clientY,touch=e.pointerType==='touch';let started=false,ghost=null,timer=null,over=null,lx=sx,ly=sy,raf=0;
   const colAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('[data-kcol]')};
   const start=()=>{started=true;const r=card.getBoundingClientRect();ghost=card.cloneNode(true);ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;pointer-events:none;z-index:90;box-shadow:0 10px 28px rgba(0,0,0,.28);transform:rotate(2deg);margin:0`;document.body.appendChild(ghost);card.classList.add('dragging');document.body.classList.add('kdrag');if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    const tick=()=>{if(!started)return;const br=scroller.getBoundingClientRect();if(lx>br.right-70)scroller.scrollLeft+=14;else if(lx<br.left+70)scroller.scrollLeft-=14;if(ly>br.bottom-70)scroller.scrollTop+=14;else if(ly<br.top+70)scroller.scrollTop-=14;raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)};
   const mv=ev=>{
    lx=ev.clientX;ly=ev.clientY;
    if(!started){const m=Math.hypot(lx-sx,ly-sy);if(touch){if(m>8)cleanup(false)}else if(m>5)start();return}
    if(ev.cancelable)ev.preventDefault();

    const c=colAt(lx,ly);if(over!==c){if(over)over.classList.remove('kover');over=c;if(c)c.classList.add('kover')}
   };
   const tm=ev=>{if(started&&ev.cancelable)ev.preventDefault()};

    if(ghost)ghost.remove();card.classList.remove('dragging');document.body.classList.remove('kdrag');

      }}}
   };
   const up=()=>cleanup(true),cn=()=>cleanup(false);
   document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cn);document.addEventListener('touchmove',tm,{passive:false});

  });
 });

/* Lista enxuta de marcações do dia a dia (tecido chegou, prova feita, entregue…) sem precisar abrir o card de cada

function acoesRapidasHTML(cards){

     número de item calculado (i), em vez do itemPl (só preenchido em peças importadas da WGT), que
     ficava deixando a maioria das peças sem nenhum número. */

   /* Se o próximo passo pendente é "enviar para a produção" mas a peça está travada esperando a prova
      da peça-piloto, não entra nas Ações rápidas (não tem nada a fazer aqui ainda) — ela continua
      aparecendo normalmente pelos passos anteriores do checklist. */
   if(prox&&!(prox[0]==='env'&&pecaBloqueadaPorProva(pd,pc)))rows.push({pd,pc,prz:pc.prazo,idLbl,titulo:pc.isOS?esc(pc.servico):esc(c.nome),sub:pc.isOS?`${esc(c.nome)} · ${esc(pc.peca)}`:`${nome} · item ${i}${tecLbl?` · ${tecLbl}`:''}`,acao:prox[1],k:prox[0]});

function bindEditor(){
 const dr=ui.draft,root=document.getElementById('ped');
 /* Campos que o lote de tecidos espelha do item principal para os outros tecidos (ver syncLote).
    Ao editar um desses campos num item já lançado (pedido/orçamento salvo), confere com o Luiz se
    aplica aos outros tecidos do lote; se ele disser que não, esses tecidos saem do lote (ficam com
    a personalização que já tinham, sem herdar mudanças futuras do item principal). */
 const CAMPOS_LOTE=['tipo','prest','prod','etiq','mono','mono2','info','modv','modo'];
 const assinLote=p=>CAMPOS_LOTE.map(k=>p[k]).concat(JSON.stringify(p.car)).join('\u0001');
 const keep=fn=>{
  const y=window.scrollY,af=document.activeElement;
  const sig=af&&af.matches&&af.matches('input,select,textarea')?(af.dataset.f?`[data-f="${af.dataset.f}"]`:af.id?`#${af.id}`:null):null;
  const pos=(af&&af.type!=='date'&&typeof af.selectionStart==='number')?af.selectionStart:null;
  fn();syncGrupoCampos(dr.pecas);syncLote(dr);render();window.scrollTo(0,y);
  if(sig){const n=document.querySelector(sig);if(n){n.focus();if(pos!=null)try{n.setSelectionRange(pos,pos)}catch(e){}}}
 };
 /* Snapshot/checagem do "aplicar a todas?": tirado ANTES do handler de clique/mudança rodar (porque
    vários handlers mexem no estado da peça antes de chamar keep()), e conferido depois que o handler
    (e o keep() que ele dispare) já terminou. Só pergunta em item já lançado (dr.editId), e só quando
    o item tem outros tecidos (lote) ligados a ele. */
 const loteSnap=()=>dr.editId?dr.pecas.filter(p=>!p.lote&&dr.pecas.some(x=>x.lote===p.uid)).map(p=>[p,assinLote(p)]):[];
 const loteCheck=snap=>{
  let mudou=false;
  snap.forEach(([p,antes])=>{
   if(assinLote(p)===antes)return;
   const membros=dr.pecas.filter(x=>x.lote===p.uid);
   if(!membros.length)return;
   const msg=membros.length>1?`Aplicar esta alteração de personalização também aos outros ${membros.length} tecidos deste item? Se não, eles saem do lote e passam a ter personalização própria.`:'Aplicar esta alteração de personalização também ao outro tecido deste item? Se não, ele sai do lote e passa a ter personalização própria.';
   if(!confirm(msg)){membros.forEach(m=>{m.lote=undefined;delete m.lpreco});mudou=true}
  });
  if(mudou)render();
 };
 const P=u=>dr.pecas.find(x=>x.uid===+u);
 const upd=()=>{dr.pecas.forEach(p=>{CARAC[p.tipo].forEach(g=>{const e=document.querySelector(`[data-gcnt="${p.uid}|${g.id}"]`);if(e){const [a,b]=grpCnt(g,p);e.textContent=a+'/'+b}});const f=document.querySelector(`[data-faltam="${p.uid}"]`);if(f){const n=pecaFalta(p);f.textContent=n?n+' a preencher':'Ficha completa';f.className='pill '+(n?'warn':'ok')}})};
 document.getElementById('d-save2').onclick=()=>document.getElementById('d-save').click();
 const sa2=document.getElementById('d-saveaprova2');if(sa2)sa2.onclick=()=>document.getElementById('d-saveaprova').click();
 document.getElementById('d-cancel2').onclick=()=>document.getElementById('d-cancel').click();
 document.getElementById('d-cancel').onclick=()=>{if(dr.editId){ui.det=dr.editId;ui.draft=null;render();return}ui.draft=null;location.hash='clientes';render()};
 document.getElementById('d-ped').onchange=e=>dr.dped=e.target.value;
 const dfm=document.getElementById('d-forma');if(dfm)dfm.onchange=e=>{dr.forma=e.target.value;keep(()=>{})};
 const dpc=document.getElementById('d-parc');if(dpc)dpc.onchange=e=>dr.parc=+e.target.value;
 const ddt=document.getElementById('d-descTipo');if(ddt)ddt.onclick=()=>{dr.descTipo=dr.descTipo==='pct'?'valor':'pct';keep(()=>{})};
 document.getElementById('d-prazoUnico').onchange=e=>{dr.prazoUnico=e.target.checked;if(dr.prazoUnico&&dr.prazoUnicoData)dr.pecas.forEach(x=>{if(!x.prazoManual)x.prazo=dr.prazoUnicoData});keep(()=>{})};
 const dpu=document.getElementById('d-prazoUnicoData');if(dpu)dpu.onchange=e=>{const el=e.target;dr.prazoUnicoData=el.value;if(dr.prazoUnico)dr.pecas.forEach(x=>{if(!x.prazoManual)x.prazo=dr.prazoUnicoData});deferRender(el,()=>keep(()=>{}))};
 root.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const _lsnap=loteSnap();
  if(t.dataset.opt){const [u,g,k,v]=t.dataset.opt.split('|');const p=P(u);p.car[g]=p.car[g]||{};p.car[g][k]=v;const gd=CARAC[p.tipo].find(x=>x.id===g),vis=camVisivel(gd,p).map(f=>f.k);gd.f.forEach(f=>{if(!vis.includes(f.k))delete p.car[g][f.k]});keep(()=>{});}
  else if(t.dataset.loteAdd){const l=P(t.dataset.loteAdd);keep(()=>{
   /* Tecido novo do lote já nasce com o MESMO tecido do último item do lote (fornecedor, referência/cor,
      metragem, forro, padronagem) em vez de em branco — pedido do cliente em 24/11/2026: no dia a dia,
      o cliente geralmente pede várias camisas/peças idênticas, então é mais rápido duplicar e editar só o
      que mudar do que preencher tudo de novo a cada tecido. Cor do monograma continua sendo a exceção
      (nunca copiada — ver LOTE_COR abaixo), porque cada tecido pode combinar com uma linha diferente. */
   const ult=Math.max(dr.pecas.indexOf(l),...dr.pecas.map((x,k)=>x.lote===l.uid?k:-1));
   const fonte=dr.pecas[ult];
   const m=newPeca(l.tipo,null,dr.cli);copiaPeca(l,m);
   Object.assign(m,{modv:l.modv,modo:l.modo,prova:l.prova,op:l.op,lote:l.uid,lpreco:l.preco,prazo:l.prazo,prazoManual:l.prazoManual,prazoProd:l.prazoProd,prazoCheg:l.prazoCheg,prazoChegManual:l.prazoChegManual,
    tecOrig:fonte.tecOrig||'comprar',forn:fonte.forn,tec:fonte.tec,metr:fonte.metr,metrNota:fonte.metrNota});
   if(temForro(m)){m.forroForn=fonte.forroForn;m.forroCod=fonte.forroCod;m.metrF=fonte.metrF}
   if(['paleto','calca','colete'].includes(m.tipo))m.pad=fonte.pad;
   LOTE_COR.forEach(g=>{if(m.car[g])delete m.car[g].cor});
   dr.pecas.splice(ult+1,0,m)

const PARTIC=new Set(['da','de','do','das','dos','e','di','du','del','della']);
const SIGLAS_OK={ltda:'Ltda',me:'ME',epp:'EPP',eireli:'Eireli',sa:'S.A.'};
function nomeProprio(t,siglas){
 return String(t).replace(/\s+/g,' ').trim().split(' ').map((w,i)=>{
  if(!w)return w;
  const bare=w.replace(/[.,]/g,'').toLowerCase();
  if(i>0&&PARTIC.has(bare))return w.toLowerCase();
  if(siglas&&SIGLAS_OK[bare])return SIGLAS_OK[bare];
  if(w.length>1&&w===w.toLocaleUpperCase('pt-BR')&&w!==w.toLocaleLowerCase('pt-BR'))return w;
  return w.split('-').map(x=>x.split(/(?<=['’])/).map(y=>y?y.charAt(0).toLocaleUpperCase('pt-BR')+y.slice(1).toLocaleLowerCase('pt-BR'):y).join('')).join('-');
 }).join(' ');
}

/* hash de senha */
async function hashPw(pw,salt){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:120000,hash:'SHA-256'},k,256);
 return b64e(new Uint8Array(b));
}
async function setSenha(u,pw){const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));u.salt=salt;u.hash=await hashPw(pw,salt)}

 if(!P.ready||P.state==='off'||!P.col||P.bkpBusy)return false;
 if(!S.clientes.length&&!S.pedidos.length&&!S.orcamentos.length)return false;
 const ult=S.cfg.bkpAuto?new Date(S.cfg.bkpAuto).getTime():0;
 if(!force&&Date.now()-ult<BKP_HORAS*36e5)return false;
 P.bkpBusy=true;
 try{
  const nome=bkpNome(),tx=bkpTexto(),partes=[];
  for(let i=0;i<tx.length;i+=BKP_CHUNK)partes.push(tx.slice(i,i+BKP_CHUNK));
  for(let n=0;n<partes.length;n++)await retry(()=>P.col.doc(did('bkp',nome+'~'+n)).set({k:'bkp',i:nome,n,j:partes[n]}));
  const lista=(S.cfg.bkpLista=S.cfg.bkpLista||[]).filter(x=>x.nome!==nome);
  lista.unshift({nome,em:new Date().toISOString(),n:partes.length,kb:Math.round(tx.length/1024),auto:!force});
  while(lista.length>BKP_MAX){const o=lista.pop();for(let n=0;n<o.n;n++){try{await P.col.doc(did('bkp',o.nome+'~'+n)).delete()}catch(e){}}}
  S.cfg.bkpLista=lista;S.cfg.bkpAuto=new Date().toISOString();
  if(typeof ui!=='undefined'&&ui.cfg==='dados'&&!document.getElementById('mdl'))render();
  return true;
 }catch(e){return false}
 finally{P.bkpBusy=false}
}
async function bkpLer(nome){
 const x=(S.cfg.bkpLista||[]).find(y=>y.nome===nome);if(!x)throw new Error('Backup não encontrado');
 let tx='';for(let n=0;n<x.n;n++){const d=await retry(()=>P.col.doc(did('bkp',nome+'~'+n)).get());if(!d.exists)throw new Error('Parte do backup ausente');tx+=d.data().j}
 return tx;
}
setInterval(()=>{bkpAuto(false)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)bkpAuto(false)});
setTimeout(()=>bkpAuto(false),8000);

 document.getElementById('pn-s').onclick=()=>{const n=parseInt(g('pn-n'),10);const max=Math.max(0,...[...S.pedidos,...S.orcamentos].map(p=>+p.id.slice(2)||0));if(!(n>=1))return toast('Número inválido');if(n<max)return toast('Já existe o pedido P-'+max+'. Use um número igual ou maior.');S.cfg.ultimoPed=n;render();toast('Numeração salva')};
 const fi=document.getElementById('bk-file');

/* ===== listas suspensas com busca (todos os <select>) ===== */
(function(){
 let P=null,S0=null;
 const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const fechar=(foco)=>{if(P){P.remove();P=null}if(S0&&foco)try{S0.focus()}catch(e){}S0=null};
 function abrir(sel){
  fechar();S0=sel;
  const itens=[];[...sel.children].forEach(n=>{if(n.tagName==='OPTGROUP'){itens.push({g:n.label});[...n.children].forEach(o=>itens.push({o}))}else if(n.tagName==='OPTION')itens.push({o:n})});
  P=document.createElement('div');P.className='ssp';P.setAttribute('role','listbox');
  P.innerHTML='<input type="text" autocomplete="off" placeholder="Digite para filtrar…" aria-label="Filtrar opções"><ul></ul>';
  document.body.appendChild(P);
  const r=sel.getBoundingClientRect(),W=Math.max(r.width,220);
  P.style.width=W+'px';P.style.left=Math.max(8,Math.min(r.left,innerWidth-W-8))+'px';
  const abaixo=innerHeight-r.bottom,h=Math.min(340,Math.max(abaixo>200?abaixo-12:r.top-12,180));
  P.style.maxHeight=h+'px';
  if(abaixo>=220||abaixo>=r.top)P.style.top=(r.bottom+4)+'px';else P.style.bottom=(innerHeight-r.top+4)+'px';
  const ul=P.querySelector('ul'),inp=P.querySelector('input');let ativo=0,vis=[];
  const pinta=()=>{const q=nz(inp.value.trim());vis=itens.filter(x=>x.g||!q||nz(x.o.textContent).includes(q));
   const com=vis.filter(x=>x.o);if(q)vis=vis.filter(x=>x.o);
   ul.innerHTML=vis.length&&com.length?vis.map((x,i)=>x.g?`<li class="gr">${x.g}</li>`:`<li data-i="${i}" role="option" class="${x.o.value===sel.value?'sel':''}">${x.o.textContent.replace(/</g,'&lt;')||'&nbsp;'}</li>`).join(''):'<li class="vz">Nada encontrado</li>';
   if(ativo>=vis.length)ativo=0;while(vis[ativo]&&vis[ativo].g)ativo++;marca()};
  const marca=()=>{ul.querySelectorAll('li.on').forEach(l=>l.classList.remove('on'));const l=ul.querySelector(`li[data-i="${ativo}"]`);if(l){l.classList.add('on');l.scrollIntoView({block:'nearest'})}};
  const escolher=i=>{const x=vis[i];if(!x||!x.o||x.o.disabled)return;const s=S0;s.value=x.o.value;fechar(true);s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}))};
  inp.addEventListener('input',()=>{ativo=0;pinta()});
  inp.addEventListener('keydown',e=>{
   if(e.key==='Escape'){e.preventDefault();e.stopPropagation();fechar(true)}
   else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const d=e.key==='ArrowDown'?1:-1;let i=ativo+d;while(vis[i]&&vis[i].g)i+=d;if(vis[i]&&vis[i].o)ativo=i;marca()}
   else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();escolher(ativo)}
   else if(e.key==='Tab'){fechar(false)}
  });
  ul.addEventListener('mousedown',e=>{const l=e.target.closest('li[data-i]');if(l){e.preventDefault();escolher(+l.dataset.i)}});
  ul.addEventListener('mousemove',e=>{const l=e.target.closest('li[data-i]');if(l&&+l.dataset.i!==ativo){ativo=+l.dataset.i;marca()}});
  const i0=vis.findIndex(x=>x.o&&x.o.value===sel.value);
  pinta();if(i0>=0){ativo=itens.findIndex(x=>x.o&&x.o.value===sel.value);ativo=vis.findIndex(x=>x.o&&x.o.value===sel.value);marca()}
  inp.focus();
 }
 const ok=t=>t&&t.tagName==='SELECT'&&!t.multiple&&!t.disabled&&!t.hasAttribute('data-nosearch');
 document.addEventListener('mousedown',e=>{
  if(P&&!P.contains(e.target)){const alvo=e.target.closest&&e.target.closest('select');fechar(false);if(alvo&&alvo===S0){e.preventDefault();return}}
  if(ok(e.target)&&e.button===0){e.preventDefault();abrir(e.target)}
 },true);
 document.addEventListener('keydown',e=>{
  if(!ok(e.target)||P)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){e.preventDefault();abrir(e.target)}
  else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();abrir(e.target);const i=P&&P.querySelector('input');if(i){i.value=e.key;i.dispatchEvent(new Event('input'))}}
 },true);
 window.addEventListener('resize',()=>fechar(false));
 document.addEventListener('scroll',e=>{if(P&&!P.contains(e.target))fechar(false)},true);
})();
chipUser();document.getElementById('userchip').onclick=contaModal;
boot();
