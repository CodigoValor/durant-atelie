<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#1E2824; --ink-2:#56605B; --ink-3:#88908A;
  --line:#E0E4DE; --rail:#20312A; --rail-ink:#F1EEDD; --rail-ink-2:#9DA89F; --btn-bg:#20312A; --btn-fg:#F4F1E2;
  --chip:#E8ECE5; --cream:#F1E7CC; --gold:#B98A2E; --amber:#FFAA57;
  --ok:#2C7552; --ok-bg:#E0EFE5; --warn:#9A6614; --warn-bg:#F6ECD9; --crit:#A8343A; --crit-bg:#F6E1E2; --info:#2F5A7A; --info-bg:#E0EAF0;
  --f-display:"Cormorant Garamond",Georgia,serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-2);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.top{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;z-index:30}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 16px}
.brand b{font:700 21px/1 var(--f-display);letter-spacing:.04em;display:block}
.brand small{font-size:9.5px;letter-spacing:.3em;color:var(--amber);font-weight:600;display:block;margin-top:4px}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;color:var(--rail-ink-2);padding:10px 12px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.nav button:hover{color:var(--rail-ink)}
.nav button[aria-current="page"]{color:var(--rail-ink);border-bottom-color:var(--amber)}
.demo{flex:none;background:rgba(255,255,255,.14);color:var(--rail-ink);font-size:11px;font-weight:600;letter-spacing:.08em;padding:5px 9px;border-radius:99px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{font-family:var(--f-display);margin:0 0 10px;line-height:1.15}
h2{font-size:24px} h3{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.row.end{justify-content:flex-end}
.row>label{flex:1;min-width:180px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:110px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.danger{background:#fff;color:var(--crit);border:1px solid var(--crit-bg)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.info{background:var(--info-bg);color:var(--info)}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;min-width:640px}
table.t th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td input,table.t td select{margin-top:0}
table.t tr.err td{background:var(--crit-bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:700 26px/1.1 var(--f-display)} .kpi span{font-size:12px;color:var(--ink-3)}
pre.msg{white-space:pre-wrap;word-break:break-word;background:#E7F5DC;border:1px solid #cfe6bd;border-radius:12px;padding:14px;font:14px/1.5 var(--f-body);margin:8px 0}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.crit{background:var(--crit-bg);color:var(--crit)} .alert.info{background:var(--info-bg);color:var(--info)}
.ped-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.ped-h b{font-family:var(--f-display);font-size:20px}
dialog{border:0;border-radius:14px;padding:20px;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,30,25,.55)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--rail);color:var(--rail-ink);padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;max-width:92vw}
footer{padding:18px 16px;color:var(--ink-3);font-size:12px;text-align:center}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
@media (max-width:700px){
  table.stack{min-width:0!important}
  table.stack thead{display:none}
  table.stack,table.stack tbody{display:block}
  table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}
  table.stack tr.err{background:var(--crit-bg)}
  table.stack td{display:block;border:0;padding:4px 0;min-width:0!important;width:auto!important}
  table.stack td::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  table.stack td.full{grid-column:1/-1}
  table.stack td.num{display:none}
  table.stack td.x{grid-column:1/-1;text-align:right}
  table.stack td.x::before{display:none}
}
@media (max-width:640px){main{padding:12px 10px 40px}.card{padding:12px}.top-in{gap:8px;padding:8px 10px}.demo{display:none}}
</style>

<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>ALINHAVO</b><small>TECIDOS</small></div>

</div></header>
<main id="app"></main>
<footer>Alinhavo · módulo Tecidos · dados de exemplo guardados apenas neste aparelho · <a href="#" data-a="restaurar" style="color:inherit">restaurar exemplo</a></footer>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script>
(function () {
'use strict';
var EMPRESA = 'Durant Alfaiataria';
var KEY = 'alinhavo.tecidos.demo.v1';

/* ---------- utilidades ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nl(s) { /* minúsculo e sem acento, mantendo o MESMO tamanho (posições batem com o texto original) */
  return String(s || '').split('').map(function (c) { var d = c.normalize('NFD').replace(/[̀-ͯ]/g, ''); return ((d || c).charAt(0).toLowerCase()) || c; }).join('');
}
function norm(s) { return nl(s).trim(); }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&'); }
function uid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function fmtM(n) { return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m'; }
function fmtBRL(n) { return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function hoje() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataBR(iso) { return String(iso || '').split('-').reverse().join('/'); }
function numBR(v) { var s = String(v == null ? '' : v).trim(); if (!s) return null; if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var n = parseFloat(s); return isFinite(n) ? n : null; }
function zap(n) { var d = String(n || '').replace(/\D/g, ''); if (d.length === 10 || d.length === 11) d = '55' + d; return d; }
var toastT;
function toast(t) { var e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { e.hidden = true; }, 3200); }

/* ---------- dados (demonstração = só neste navegador; no banco, tudo passa por gravar/apagar) ---------- */
function semente() {
  var ls = uid(), imp = uid(), mb = uid();
  function t(loja, ref, nome, comp, larg, cor, preco, apel) { return { id: uid(), loja_id: loja, referencia: ref, nome: nome, composicao: comp, largura_cm: larg, cor: cor, preco_metro: preco, apelidos: apel || [], ativo: true }; }
  return {
    v: 1, seq: 0,
    lojas: [{ id: ls, nome: 'LS Tecidos', whatsapp: '', ativo: true }, { id: imp, nome: 'Imperiale', whatsapp: '', ativo: true }, { id: mb, nome: 'Mark Bell', whatsapp: '', ativo: true }],
    vendedores: [
      { id: uid(), loja_id: ls, nome: 'Carlos (exemplo)', whatsapp: '', principal: true, ativo: true },
      { id: uid(), loja_id: ls, nome: 'Renata (exemplo)', whatsapp: '', principal: false, ativo: true },
      { id: uid(), loja_id: imp, nome: 'Vendedor Imperiale (exemplo)', whatsapp: '', principal: true, ativo: true },
      { id: uid(), loja_id: mb, nome: 'Vendedor Mark Bell (exemplo)', whatsapp: '', principal: true, ativo: true }
    ],
    catalogo: [
      t(ls, '405/3', 'Azul marinho liso', '100% lã', 150, 'Azul marinho', 390, ['azul marinho da ls']),
      t(ls, '405/7', 'Cinza chumbo liso', '100% lã', 150, 'Cinza', 390, []),
      t(ls, '512', 'Príncipe de Gales', 'Lã e seda', 148, 'Cinza e azul', 520, ['principe de gales']),
      t(imp, '210/1', 'Linho puro', '100% linho', 140, 'Bege', 310, ['linho bege']),
      t(imp, '210/4', 'Linho puro', '100% linho', 140, 'Azul claro', 310, []),
      t(mb, '88-12', 'Algodão fio 120', '100% algodão', 145, 'Branco', 180, ['branco 120'])
    ],
    destinos: [{ id: uid(), nome: 'Ateliê', endereco: '', padrao: true, ativo: true }, { id: uid(), nome: 'Maria', endereco: '', padrao: false, ativo: true }, { id: uid(), nome: 'WGT', endereco: '', padrao: false, ativo: true }],
    pedidos: [], itens: [], mensagens: []
  };
}
var S;
function carregar() { try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); if (o && o.v === 1) return o; } } catch (e) {} return semente(); }
function salvar() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
/* ponto único de escrita: ligar ao Supabase é trocar só estas duas funções (tabelas tec_*, ver migração 0010) */
function gravar(tab, row) { var l = S[tab], i = l.findIndex(function (x) { return x.id === row.id; }); if (i >= 0) l[i] = row; else l.push(row); salvar(); return row; }
function apagar(tab, id) { S[tab] = S[tab].filter(function (x) { return x.id !== id; }); salvar(); }
function por(tab, id) { return S[tab].find(function (x) { return x.id === id; }); }

/* ---------- interpretação do pedido (regras; a versão com IA troca só esta função) ---------- */
var NOME = "\\p{Lu}[\\p{L}'’.-]*(?:\\s+(?:d[aeo]s?\\s+)?\\p{Lu}[\\p{L}'’-]*){0,3}";
var reCli1 = new RegExp("(?:\\bque\\s+(?:é|e)(?=\\s)|\\bcliente(?:\\s+(?:dele|dela))?\\s*(?::|é(?=\\s)|e(?=\\s))?)\\s*(?:o\\s+|a\\s+)?(" + NOME + ")", 'u');
var reCli2 = new RegExp("(?:\\b[Pp]ara|\\b[Pp]ro|\\b[Pp]ra|\\b[Pp]\\/)\\s+(?:o\\s+|a\\s+|os\\s+|as\\s+)?(?:cliente\\s+)?(" + NOME + ")", 'u');
var reRef = /(?<![A-Za-z0-9\/.,-])(\d{2,5}(?:\s?[\/-]\s?[A-Za-z0-9]{1,4})?)(?![A-Za-z0-9\/])/g;

function chaveRef(s) { return norm(s).replace(/\s+/g, ''); }
function resolverRef(texto, lojaId) {
  var k = chaveRef(texto);
  if (!k) return { cat: null, match: 'vazio' };
  var ativos = S.catalogo.filter(function (c) { return c.ativo; });
  function acha(lista) { return lista.find(function (c) { return chaveRef(c.referencia) === k || (c.apelidos || []).some(function (a) { return chaveRef(a) === k; }); }); }
  var c = acha(ativos.filter(function (x) { return x.loja_id === lojaId; }));
  if (c) return { cat: c, match: 'ok' };
  c = acha(ativos);
  if (c) return { cat: c, match: 'outra_loja' };
  return { cat: null, match: 'desconhecido' };
}
function achaAncoras(linha, lojaId) {
  var L = nl(linha), out = [];
  var ativos = S.catalogo.filter(function (c) { return c.ativo; });
  ativos.forEach(function (c) {
    var pri = c.loja_id === lojaId ? 0 : 1;
    [c.referencia].concat(c.apelidos || []).forEach(function (term) {
      var tt = nl(term).trim(); if (!tt) return;
      var re = new RegExp('(?<![a-z0-9/.,-])' + tt.split(/\s+/).map(escRe).join('\\s+') + '(?![a-z0-9/])', 'g'), m;
      while ((m = re.exec(L))) out.push({ start: m.index, end: m.index + m[0].length, raw: linha.slice(m.index, m.index + m[0].length), pri: pri, len: m[0].length });
    });
  });
  var m2; reRef.lastIndex = 0;
  while ((m2 = reRef.exec(linha))) out.push({ start: m2.index, end: m2.index + m2[0].length, raw: m2[0], pri: 2, len: m2[0].length });
  out.sort(function (a, b) { return a.start - b.start || a.pri - b.pri || b.len - a.len; });
  var res = [], fim = -1;
  out.forEach(function (a) { if (a.start >= fim) { res.push(a); fim = a.end; } });
  return res;
}
function extrairMetragem(txt) {
  var m = /(\d+(?:[.,]\d+)?)\s*(?:cm\b)/i.exec(txt);
  if (m) { var cm = numBR(m[1]); if (cm) return Math.round(cm) / 100; }
  m = /(\d+(?:[.,]\d+)?)\s*(?:m\b|mt\b|mts\b|metros?\b)/i.exec(txt);
  if (m) return numBR(m[1]);
  m = /(?<![\w\/])(\d{1,2}[.,]\d{1,2})(?![\w\/])/.exec(txt);
  return m ? numBR(m[1]) : null;
}
function destinoDe(txt, padrao) {
  var T = norm(txt), achado = null;
  S.destinos.filter(function (d) { return d.ativo; }).forEach(function (d) {
    var n = norm(d.nome); if (!n) return;
    if (new RegExp('(?:^|[^a-z0-9])(?:para|pra|pro|na|no|ao|a|em)\\s+(?:o\\s+|a\\s+)?' + n.split(/\s+/).map(escRe).join('\\s+') + '(?![a-z0-9])').test(T)) achado = d;
  });
  if (!achado && /(?:^|[^a-z0-9])(?:para|pra|pro)\s+mim(?![a-z0-9])/.test(T)) achado = padrao || null;
  return achado;
}
function interpretar(texto, lojaId) {
  var padrao = S.destinos.find(function (d) { return d.ativo && d.padrao; }) || S.destinos.find(function (d) { return d.ativo; }) || null;
  var linhas = String(texto || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
  var chunks = [], globalDest = null;
  linhas.forEach(function (ln) {
    var an = achaAncoras(ln, lojaId);
    if (!an.length) {
      var g = /(?:tudo|todos|todas)\s+(?:(?:para|pra|pro|na|no)\s+)?(?:o\s+|a\s+)?(.+)/i.exec(ln);
      if (g) { var dd = destinoDe('para ' + g[1], padrao); if (dd) globalDest = dd; }
      if (chunks.length) chunks[chunks.length - 1].extra += ' ' + ln;
      return;
    }
    an.forEach(function (a, i) {
      var ate = i + 1 < an.length ? an[i + 1].start : ln.length;
      chunks.push({ anc: a, texto: (i === 0 ? ln.slice(0, a.start) + ' ' : '') + ln.slice(a.start, ate), extra: '' });
    });
  });
  var avisos = [];
  var itens = chunks.map(function (c) {
    var t = c.texto + ' ' + c.extra;
    var semAnc = t.replace(c.anc.raw, ' ');
    var met = extrairMetragem(semAnc);
    var cli = null, m = reCli1.exec(semAnc);
    if (m) cli = m[1]; else { m = reCli2.exec(semAnc); if (m) cli = m[1]; }
    var dest = destinoDe(t, padrao);
    if (cli && S.destinos.some(function (d) { return d.ativo && norm(d.nome) === norm(cli); })) { if (!dest) dest = S.destinos.find(function (d) { return norm(d.nome) === norm(cli); }); cli = null; }
    var assumido = false;
    if (!dest) { dest = globalDest || padrao; assumido = !!dest; }
    var r = resolverRef(c.anc.raw, lojaId);
    return { referencia: r.cat ? r.cat.referencia : c.anc.raw.replace(/\s+/g, ''), catalogo_id: r.cat ? r.cat.id : null, match: r.match,
      metragem: met, cliente_final: cli ? cli.replace(/[.,;:\s]+$/, '') : '', destino_id: dest ? dest.id : '', assumido: assumido };
  });
  if (!itens.length && String(texto || '').trim()) avisos.push('Não encontrei nenhum tecido no texto. Confira se a referência está escrita (ex.: 405/3) ou adicione o item manualmente.');
  return { itens: itens, avisos: avisos };
}
function interpretarResposta(texto, itens) {
  var out = [], linhas = String(texto || '').split(/\n|;/).map(function (x) { return x.trim(); }).filter(Boolean);
  function classe(t) {
    t = norm(t);
    if (/(sem estoque|nao tem|nao temos|nao ha|acabou|esgotad|indisponi|em falta|nao consigo|nao chegou)/.test(t)) return { st: 'indisponivel' };
    var p = /(?:so|apenas|somente|tenho|temos|sobrou|restam?|ficou)\s*(?:uns?\s*)?(\d+(?:[.,]\d+)?)\s*(?:m\b|mt|mts|metros?)/.exec(t);
    if (p) return { st: 'parcial', met: numBR(p[1]) };
    if (/(\bok\b|\btem\b|\btemos\b|dispon|separad|confirmad|\bcerto\b|beleza|pode\b|fechado|positivo|\bsim\b)/.test(t)) return { st: 'disponivel' };
    return null;
  }
  linhas.forEach(function (ln) {
    var g = /^(?:tudo|todos|todas)\b(.*)$/i.exec(ln);
    if (g) { var c0 = classe(g[1] || 'ok'); if (c0) itens.forEach(function (it, i) { if (!out.some(function (o) { return o.i === i; })) out.push({ i: i, st: c0.st, met: c0.met }); }); return; }
    var m = /^(?:item\s*)?(\d{1,2})\s*[).:\-–]?\s*(.*)$/i.exec(ln);
    var idx = -1, resto = ln;
    if (m && +m[1] >= 1 && +m[1] <= itens.length) { idx = +m[1] - 1; resto = m[2]; }
    else { var n = norm(ln); idx = itens.findIndex(function (it) { return n.indexOf(norm(it.referencia)) >= 0; }); }
    if (idx < 0) return;
    var c = classe(resto || ln); if (!c) return;
    out = out.filter(function (o) { return o.i !== idx; });
    out.push({ i: idx, st: c.st, met: c.met });
  });
  return out;
}

/* ---------- mensagem para o vendedor ---------- */
function montarMensagem(numero, dia, loja, vend, itens) {
  var L = [];
  L.push('*Pedido de tecido' + (numero ? ' nº ' + numero : '') + ' — ' + dataBR(dia) + '*');
  L.push(EMPRESA + (loja ? ' → ' + loja.nome : ''));
  L.push('');
  L.push('Olá' + (vend && vend.nome ? ', ' + vend.nome.replace(/\s*\(exemplo\)/i, '').split(' ')[0] : '') + '! Segue o pedido de hoje:');
  var grupos = [], idx = {};
  itens.forEach(function (it, i) {
    var d = it.destino_id ? por('destinos', it.destino_id) : null, k = d ? d.id : '_';
    if (!(k in idx)) { idx[k] = grupos.length; grupos.push({ d: d, its: [] }); }
    grupos[idx[k]].its.push({ n: i + 1, it: it });
  });
  var total = 0;
  grupos.forEach(function (g) {
    L.push('');
    L.push('*Entrega: ' + (g.d ? g.d.nome : 'a definir') + '*' + (g.d && g.d.endereco ? ' (' + g.d.endereco + ')' : ''));
    g.its.forEach(function (x) {
      var c = x.it.catalogo_id ? por('catalogo', x.it.catalogo_id) : null;
      total += Number(x.it.metragem) || 0;
      L.push(x.n + ') Ref. ' + x.it.referencia + (c && c.nome ? ' (' + c.nome + (c.cor ? ', ' + c.cor : '') + ')' : '') + ' — ' + fmtM(x.it.metragem) + (x.it.cliente_final ? ' — Cliente: ' + x.it.cliente_final : ''));
    });
  });
  L.push('');
  L.push('Total: ' + fmtM(total) + ' em ' + itens.length + (itens.length === 1 ? ' item.' : ' itens.'));
  L.push('Por favor, responda item a item. Ex.: "1 ok", "2 sem estoque", "3 só 1,20 m".');
  return L.join('\n');
}

}
function recalc(p) {

}
function copiar(txt) {
  function fallback() { var t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(fallback); else fallback();

    S.mensagens.push({ id: uid(), pedido_id: p.id, direcao: 'entrada', corpo: tx.value, criado_em: new Date().toISOString() });
