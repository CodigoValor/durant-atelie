<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Pedido de tecido · Alinhavo</title>
<meta name="robots" content="noindex,nofollow">

<style>
:root{--bg:#F6F2E9;--ink:#1B241E;--green:#1F3A29;--brass:#B58A3A;--brass-t:#8A6420;--card:#E0D8C3;--in:#CBC3AE;--muted:#5A6258;--call:#EFE8D6;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Gelasio,Georgia,serif;margin:0;font-weight:700;line-height:1.15}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hom{background:#B3261E;color:#fff;text-align:center;font-size:12px;font-weight:600;letter-spacing:.08em;padding:4px}
.top{background:var(--green);border-bottom:3px solid var(--brass);color:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:24px}
.brand{padding:12px 0}
.brand b{font:700 18px/1 Gelasio,Georgia,serif;letter-spacing:.16em;display:block;text-transform:uppercase}
.brand small{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#D9C48F}
.nav{display:flex;gap:22px;flex:1;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;color:#D9C8A0;font-weight:500;font-size:14px;padding:18px 2px;cursor:pointer;white-space:nowrap}
.nav button[aria-current=page]{color:var(--bg);border-bottom-color:var(--brass)}
.who{font-size:13px;color:#D9C8A0;display:flex;gap:12px;align-items:center;white-space:nowrap}
.who a{color:#D9C8A0;cursor:pointer;text-decoration:underline}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:24px 18px 40px}
main.cli{max-width:600px}
.ey{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-t)}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.pn{background:#fff;border:1px solid var(--card);border-radius:10px;padding:16px 18px;margin:14px 0}
.call{border-left:3px solid var(--brass);background:var(--call);padding:12px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:#3A433C;margin:14px 0}
.err{border-left:3px solid var(--cr);background:var(--cr-bg);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--cr);margin:12px 0}
label{display:block;font-size:13px;font-weight:600;margin-top:12px}
input,select,textarea{width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--in);border-radius:8px;background:#fff;font-size:16px}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 22px;border-radius:8px;border:0;background:var(--green);color:var(--bg);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.dg{background:#fff;color:var(--cr);border:1.5px solid var(--cr)}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.c{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--gr-bg);color:var(--gr)}
.c.ok{background:var(--ok-bg);color:var(--ok)}.c.wn{background:var(--wn-bg);color:var(--wn)}.c.in{background:var(--inf-bg);color:var(--inf)}.c.cr{background:var(--cr-bg);color:var(--cr)}
.m{font-size:13px;color:var(--muted)}
.vl{font-family:Gelasio,Georgia,serif;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.kp>div{background:#fff;border:1px solid var(--card);border-radius:10px;padding:16px 18px}
.kp b{display:block;font:700 30px/1.1 Gelasio,Georgia,serif}
.kp span{font-size:13px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1.5px solid var(--green)}
table.t td{padding:11px 10px;border-bottom:1px solid #EFE9D8;vertical-align:middle}
table.t td input{margin:0;padding:8px 10px;font-size:14px}
.tw{overflow-x:auto}
.it{border:1px solid var(--card);border-radius:10px;padding:12px 14px;background:#fff;margin:10px 0}
.it.bad{border:1.5px solid var(--brass);background:#FFFAEC}
.pg{height:6px;border-radius:6px;background:#E8E2D0;overflow:hidden;margin:6px 0}.pg i{display:block;height:100%;background:#2F6B3F}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;height:44px;border-radius:8px;border:1.5px solid var(--in);background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on-ok{background:var(--ok-bg);border-color:#2F6B3F;color:var(--ok)}
.seg button.on-wn{background:var(--wn-bg);border-color:var(--brass);color:var(--wn)}
.seg button.on-cr{background:var(--cr-bg);border-color:var(--cr);color:var(--cr)}
.bn{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--card);display:flex}
.bn button{flex:1;background:none;border:0;padding:11px 0 13px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:52px}
.bn button[aria-current=page]{color:var(--green)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--in);background:#fff;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--green);border-color:var(--green);color:var(--bg);font-weight:600}
.cen{max-width:440px;margin:0 auto}
.seg2{display:flex;border:1.5px solid var(--in);border-radius:8px;overflow:hidden;margin-top:6px}
.seg2 button{flex:1;height:44px;border:0;background:#fff;font-weight:600;cursor:pointer}
.seg2 button.on{background:var(--green);color:var(--bg)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--green);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;max-width:92vw}
footer{padding:14px;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:700px){.who span{display:none}.nav{gap:14px}}
@media print{.top,.bn,.hom,footer,#toast{display:none}}
</style>

var NOME = "\\p{Lu}[\\p{L}'’.-]*(?:\\s+(?:d[aeo]s?\\s+)?\\p{Lu}[\\p{L}'’-]*){0,3}";
var reCli1 = new RegExp("(?:\\bque\\s+(?:é|e)(?=\\s)|\\bcliente(?:\\s+(?:dele|dela))?\\s*(?::|é(?=\\s)|e(?=\\s))?)\\s*(?:o\\s+|a\\s+)?(" + NOME + ")", 'u');

function resolverRef(texto, lojaId) {

  function acha(lista) { return lista.find(function (c) { return chaveRef(c.referencia) === k || (c.apelidos || []).some(function (a) { return chaveRef(a) === k; }); }); }

    var a = acha2(minha); if (a) return { cat: a, match: 'ok', cor: cor };
    a = acha2(ativos); if (a) return { cat: a, match: 'outra_loja', cor: cor };

function achaAncoras(linha, lojaId) {
  var L = nl(linha), out = [];

  ativos.forEach(function (c) {

function extrairMetragem(txt) {

  if (m) { var cm = numBR(m[1]); if (cm) return Math.round(cm) / 100; }

  return m ? numBR(m[1]) : null;
}
function destinoDe(txt, padrao) {
  var T = norm(txt), achado = null;
  S.destinos.filter(function (d) { return d.ativo; }).forEach(function (d) {
    var n = norm(d.nome); if (!n) return;
    if (new RegExp('(?:^|[^a-z0-9])(?:para|pra|pro|na|no|ao|a|em)\\s+(?:o\\s+|a\\s+)?' + n.split(/\s+/).map(escRe).join('\\s+') + '(?![a-z0-9])').test(T)) achado = d;
  });

function interpretar(texto, lojaId) {
  var padrao = S.destinos.find(function (d) { return d.ativo && d.padrao; }) || S.destinos.find(function (d) { return d.ativo; }) || null;
  var linhas = String(texto || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
  var chunks = [], globalDest = null;
  linhas.forEach(function (ln) {
    var an = achaAncoras(ln, lojaId);
    if (!an.length) {
      var g = /(?:tudo|todos|todas)\s+(?:(?:para|pra|pro|na|no)\s+)?(?:o\s+|a\s+)?(.+)/i.exec(ln);
      if (g) { var dd = destinoDe('para ' + g[1], padrao); if (dd) globalDest = dd; }
      if (chunks.length) chunks[chunks.length - 1].extra += ' ' + ln;
      return;
    }
    an.forEach(function (a, i) {
      var ate = i + 1 < an.length ? an[i + 1].start : ln.length;
      chunks.push({ anc: a, texto: (i === 0 ? ln.slice(0, a.start) + ' ' : '') + ln.slice(a.start, ate), extra: '' });
    });
  });
  var avisos = [];
  var itens = chunks.map(function (c) {
    var t = c.texto + ' ' + c.extra;
    var semAnc = t.replace(c.anc.raw, ' ');

    var cli = null, m = reCli1.exec(semAnc);

    var assumido = false;
    if (!dest) { dest = globalDest || padrao; assumido = !!dest; }

    return { referencia: r.cat ? (r.cor ? r.cat.referencia + '/' + r.cor : r.cat.referencia) : c.anc.raw.replace(/\s+/g, ''), catalogo_id: r.cat ? r.cat.id : null, match: r.match,

  });

}
function interpretarResposta(texto, itens) {
  var out = [], linhas = String(texto || '').split(/\n|;/).map(function (x) { return x.trim(); }).filter(Boolean);
  function classe(t) {
    t = norm(t);
    if (/(sem estoque|nao tem|nao temos|nao ha|acabou|esgotad|indisponi|em falta|nao consigo|nao chegou)/.test(t)) return { st: 'indisponivel' };
    var p = /(?:so|apenas|somente|tenho|temos|sobrou|restam?|ficou)\s*(?:uns?\s*)?(\d+(?:[.,]\d+)?)\s*(?:m\b|mt|mts|metros?)/.exec(t);
    if (p) return { st: 'parcial', met: numBR(p[1]) };
    if (/(\bok\b|\btem\b|\btemos\b|dispon|separad|confirmad|\bcerto\b|beleza|pode\b|fechado|positivo|\bsim\b)/.test(t)) return { st: 'disponivel' };
    return null;
  }
  linhas.forEach(function (ln) {
    var g = /^(?:tudo|todos|todas)\b(.*)$/i.exec(ln);
    if (g) { var c0 = classe(g[1] || 'ok'); if (c0) itens.forEach(function (it, i) { if (!out.some(function (o) { return o.i === i; })) out.push({ i: i, st: c0.st, met: c0.met }); }); return; }
    var m = /^(?:item\s*)?(\d{1,2})\s*[).:\-–]?\s*(.*)$/i.exec(ln);
    var idx = -1, resto = ln;
    if (m && +m[1] >= 1 && +m[1] <= itens.length) { idx = +m[1] - 1; resto = m[2]; }
    else { var n = norm(ln); idx = itens.findIndex(function (it) { return n.indexOf(norm(it.referencia)) >= 0; }); }
    if (idx < 0) return;
    var c = classe(resto || ln); if (!c) return;
    out = out.filter(function (o) { return o.i !== idx; });
    out.push({ i: idx, st: c.st, met: c.met });
  });
  return out;
}

/* ---------- mensagem para o vendedor ---------- */

/* ---------- base ---------- */
var S = { catalogo: [], destinos: [] };
var X = { user: null, modo: '', emp: null, empNome: '', lojaEmp: null, lojaNome: '', lojaId: null, vinculo: null, vinculos: [] };
var aba = '';
var N = { etapa: 'texto', texto: '', itens: [], avisos: [], num: null };
var cacheCli = null;
var $app = $('#app');
function ok(r) { if (r && r.error) throw r.error; return r.data; }
function msg(e) {
  var m = (e && (e.message || e.error_description)) || String(e || 'Erro');
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos e depois entre.';
  if (/User already registered/i.test(m)) return 'Este e-mail já tem cadastro. Use "Entrar".';

}
function erro(e) { return '<div class="err" role="alert">' + esc(msg(e)) + '</div>'; }
function chip(t, k) { return '<span class="c ' + (k || '') + '">' + esc(t) + '</span>'; }
function maskDoc(d) { d = String(d || '').replace(/\D/g, ''); return d.length === 11 ? d.slice(0, 3) + '.' + d.slice(3, 6) + '.' + d.slice(6, 9) + '-' + d.slice(9) : d.length === 14 ? d.slice(0, 2) + '.' + d.slice(2, 5) + '.' + d.slice(5, 8) + '/' + d.slice(8, 12) + '-' + d.slice(12) : d; }
function dtBR(iso) { if (!iso) return ''; var d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

    $('#n-ok').onclick = async function () { try { var pr = numBR($('#n-pr').value); if (!$('#n-ref').value.trim() || pr == null) throw new Error('Informe o artigo e o preço.'); ok(await sb.from('tec_catalogo').insert({ empresa_id: X.emp, loja_id: X.lojaId, referencia: $('#n-ref').value.trim(), nome: $('#n-nome').value.trim() || null, preco_metro: pr })); toast('Artigo salvo'); lCatalogo(); } catch (e) { $('#e').innerHTML = erro(e); } };
    $app.onchange = async function (e) {
      try {
        if (e.target.dataset.pr) { var pr = numBR(e.target.value); if (pr == null || pr < 0) throw new Error('Preço inválido.'); ok(await sb.from('tec_catalogo').update({ preco_metro: pr }).eq('id', e.target.dataset.pr)); toast('Preço atualizado'); }
        if (e.target.dataset.at) { ok(await sb.from('tec_catalogo').update({ ativo: e.target.checked }).eq('id', e.target.dataset.at)); toast(e.target.checked ? 'Artigo ativo' : 'Artigo inativo'); lCatalogo(); }
      } catch (x) { $('#e').innerHTML = erro(x); }
    };
  } catch (e) { $app.innerHTML = erro(e); }
}

sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') telaNovaSenha(); });
function telaNovaSenha() {
  chrome(); $app.innerHTML = '<div class="cen"><h1>Nova senha</h1><form id="f" class="pn"><label>Nova senha<input id="pw" type="password" minlength="6" autocomplete="new-password" required></label><div id="e"></div><div style="margin-top:14px"><button class="btn full">Salvar senha</button></div></form></div>';
  $('#f').onsubmit = async function (ev) { ev.preventDefault(); try { ok(await sb.auth.updateUser({ password: $('#pw').value })); history.replaceState(null, '', location.pathname); boot(); } catch (e) { $('#e').innerHTML = erro(e); } };
}
boot();
})();
</script>
