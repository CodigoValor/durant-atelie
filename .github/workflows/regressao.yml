name: Regressão (homologação)
on:
  pull_request:
    branches: [homologacao]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: regressao-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit
      - name: Verificar dependências
        run: npm audit --audit-level=high
      - name: Instalar Chromium
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Executar regressão
        run: npm test
