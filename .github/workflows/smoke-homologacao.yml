name: Verificação pós-deploy (homologação)
on:
  push:
    branches: [homologacao]
permissions:
  contents: read
concurrency:
  group: smoke-homologacao
  cancel-in-progress: true
jobs:
  smoke-homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Aguardar o commit nos dois domínios de homologação
        env:
          ALINHAVO_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..12}; do
            if node tools/smoke-homologacao.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 15
            fi
          done
          echo "::error::O deploy de homologação falhou na verificação pós-publicação."
          exit 1
